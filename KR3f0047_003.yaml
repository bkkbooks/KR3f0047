body:
  text: 界説十則第一界凡圜之徑線等或從心至圜界線等為等圜三卷將論圜之情故先為圜界説此解圜之等者如上圖甲乙乙丙兩徑等或丁巳戊庚從心至圜界等即甲巳乙乙庚丙兩圜等若下圖甲乙乙丙兩徑不等或丁巳戊庚從心至圜界不等則兩圜亦不等矣第二界凡直線切圜界過之而不與界交為切線甲乙線切乙巳丁圜之界乙又引長之至丙而不與界交其甲丙線全在圜外為切線若戊巳線先切圜界而引之至庚入圜内則交線也第三界凡兩圜相切而不相交為切圜甲乙兩圜不相交而相切于丙或切于外如第一圖或切于内如第三圖其第二第四圖則交圜也第四界凡圜内直線從心下垂線其垂線大小之度即直線距心逺近之度凡一點至一直線上惟垂線至近其他即逺垂線一而巳逺者無數也故欲知點與線相去逺近必用垂線為度試如前圖甲點與乙丙線相去逺近必以甲丁垂線為度為甲丁一線獨去直線至近他若甲戊甲巳諸線愈大愈逺乃至無數故如後圖説甲乙丙丁圜内之甲乙丙丁兩線其去戊心逺近等為巳戊庚戊兩垂線等故若辛壬線去戊心近矣為戊癸垂線小故第五界凡直線割圜之形為圜分甲乙丙丁圜之乙丁直線任割圜之一分如甲乙丁及乙丙丁兩形皆為圜分凡分有三形其過心者為半圜分函心者為圜大分不函心者為圜小分又割圜之直線為弦所割圜界之一分為弧第六界凡圜界偕直線内角為圜分角以下三界論圜角三種本界所言雜圜也其在半圜分内為半圜角在大分内為大分角在小分内為小分角第七界凡圜界任于一點出兩直線作一角為負圜分角甲乙丙圜分甲丙為底于乙點出兩直線作甲乙丙角形其甲乙丙角為負甲乙丙圜分角第八界若兩直線之角乘圜之一分為乘圜分角甲乙丙丁圜内于甲點出甲乙甲丁兩線其乙甲丁角為乘乙丙丁圜分角圜角三種之外或兩圜相切其兩圜相切者又或内或外如上圖甲乙線切丙丁戊圜于丙即甲丙丁乙丙戊兩角為切邊角又丙丁戊巳戊庚兩圜外相切于戊及巳戊庚巳辛壬兩圜内相切于巳即丙戊巳戊巳辛壬巳庚三角俱為切邊角第九界凡從圜心以兩直線作角偕圜界作三角形為分圜形甲乙丙丁圜從戊心出戊甲戊丙兩線偕甲丁丙圜界作角形為分圜形第十界凡圜内兩負圜分角相等即所負之圜分相似甲乙丙丁圜内有甲乙巳與丁丙戊兩負圜分角等則所負甲乙丁巳與丁丙甲戊兩圜分相似又有兩圜或等幾何原本第三卷之首终本篇論圜計三十七題泰西利瑪竇口譯吳淞徐光啓筆受第一題有圜求尋其心法曰甲乙丙丁圜求尋其心先于圜之兩界任作一甲丙直線次兩平分之于戊一卷十次于戊上作乙丁垂線兩平分之于巳即巳為圜心論曰如云不然令言心何在彼不得言在巳之上下何者乙丁線既平分于巳離平分不能為心故必言心在乙丁線外為庚即令自庚至丙至戊至甲各作直線則甲庚戊角形之甲戊既與丙庚戊角形之丙戊兩邊等戊庚同邊而庚甲庚丙兩線俱從心至界宜亦等即對等邊之庚戊甲庚戊丙兩角宜亦等一卷八而為兩直角矣一卷界説十夫乙戊甲既直角而庚戊甲又為直角可不可也系因此推顯圜内有直線分他線為兩平分而作直角即圜心在其内第二題圜界任取二點以直線相聯則直線全在圜内解曰甲乙丙圜界上任取甲丙二點作直線相聨題言甲丙線全在圜内論曰如云在外若甲丁丙線令尋取甲乙丙圜之戊心本篇一次作戊甲戊丙兩直線次于甲丁丙線上作戊乙丁線而與圜界遇于乙即戊甲丁丙當為三角形以甲丁丙為底戊甲戊丙兩腰等其戊甲丙戊丙甲兩角宜等一卷五而戊丁甲為戊丙丁之外角宜大于戊丙丁角即亦宜大于戊甲丁角一卷十六則對戊丁甲大角之戊甲線宜大于戊丁線矣一卷十九夫戊甲與戊乙本同圜之半徑等據如所論則戊乙亦大于戊丁不可通也若云不在圜外而在圜界依前論令戊甲大于戊乙亦不可通也第三題直線過圜心分他直線為兩平分其分處必為兩直角為兩直角必兩平分解曰乙丙丁圜有丙戊線過甲心分乙丁線為兩平分于巳題言甲巳必是垂線而巳旁為兩直角又言巳旁既為兩直角則甲巳分乙丁必兩平分先論曰試從甲作甲乙甲丁兩線即甲乙巳角形之乙巳與甲丁巳角形之丁巳兩邊等甲巳同邊甲乙甲丁兩線俱從心至界又等即兩形等則其對等邊之甲巳乙甲巳丁亦等一卷八而為兩直角矣後論曰如前作甲乙甲丁兩線甲乙丁角形之甲乙甲丁兩邊既等則甲乙丁甲丁乙兩角亦等一卷五又甲乙巳角形之甲巳乙甲乙巳兩角與甲丁巳角形之甲巳丁甲丁巳兩角各等而對直角之甲乙甲丁兩邊又等則巳乙巳丁兩邊亦等一卷廿六欲顯次論之㫖又有一説如甲丁上直角方形與甲巳巳丁上兩直角方形并等一卷四七而甲乙上直角方形與甲巳乙巳上兩直角方形并亦等即甲巳巳乙上兩直角方形并與甲巳巳丁上兩直角方形并亦等此二率者每減一甲巳上直角方形則所存乙巳巳丁上兩直角方形自相等而兩邊亦等第四題圜内不過心兩直線相交不得俱為兩平分解曰甲丙乙丁圜内有甲乙丙丁兩直線俱不過巳心若一過心一不過心即兩線不得俱為兩平分其理易顯而交于戊題言兩直線或有一線為兩平分不得俱為兩平分論曰若云不然而甲乙丙丁能俱兩平分于戊試令尋本圜心于巳本篇一從巳至戊作甲乙之垂線其巳戊既分甲乙為兩平分即為兩直角本篇三而又能分丙丁為兩平分亦宜為兩直角是巳戊甲為直角而巳戊丙亦直角全與其分等矣第五題兩圜相交必不同心解曰甲乙丁戊乙丁兩圜交于乙于丁題言兩圜不同心論曰若言丙為同心令自丙至乙至甲各作直線其丙乙至圜交而丙甲截兩圜之界于戊于甲夫丙既為戊乙丁圜之心則丙乙與丙戊等而又為甲乙丁圜之心則丙乙與丙甲又等是丙戊與丙甲亦等而全與其分等也第六題兩圜内相切必不同心解曰甲乙丙乙兩圜内相切于乙題言兩圜不同心論曰若言丁為同心令自丁至乙至丙各作直線其丁乙至切界而丁丙截兩圜之界于甲于丙夫丁既為甲乙圜之心則丁乙與丁甲等而又為丙乙圜之心則丁乙與丁丙又等是丁甲與丁丙亦等而全與其分等也第七題圜徑離心任取一點從點至圜界任出幾線其過心線最大不過心線最小餘線愈近心者愈大愈近不過心線者愈小而諸線中止兩線等解曰甲丙丁戊乙圜其徑甲乙其心巳離心任取一點為庚從庚至圜界任出幾線為庚丙庚丁庚戊題先言從庚所出諸線惟過心庚甲最大次言不過心庚乙最小三言庚丙大于庚丁庚丁大于庚戊愈近心愈大愈近庚乙愈小後言庚乙兩旁止可出兩線等先論曰試從巳心出三線至丙至丁至戊其丙巳庚角形之丙巳巳庚兩邊并大于丙庚一邊一卷二十而丙巳巳庚等于甲巳巳庚則庚甲大于庚丙依顯庚丁庚戊俱小于庚甲是庚甲最大次論曰巳庚戊角形之巳戊一邊小于巳庚庚戊兩邊并一卷二十而巳戊與巳乙等則巳乙小于巳庚庚戊并矣次各減同用之巳庚則庚乙小于庚戊依顯庚戊小于庚丁庚丁小于庚丙是庚乙最小三論曰丙巳庚角形之丙巳與丁巳庚角形之丁巳兩邊等巳庚同邊而丙巳庚角大于丁巳庚角全大于分則對大角之庚丙邊大于對小角之庚丁邊一卷廿四依顯庚丁大于庚戊而愈近心愈大愈近庚乙愈小後論曰試依戊巳乙作乙巳辛相等角而抵圜界為巳辛線次從庚作庚辛線其戊巳庚角形之戊巳腰與庚巳辛角形之辛巳腰既等巳庚同腰兩腰間角又等則對等角之庚戊庚辛兩底亦等一卷四而庚乙兩旁之庚戊庚辛等矣此外若有從庚出線在辛之上即依第三論大于庚辛在辛之下即小于庚辛故云庚乙兩旁止可出庚戊庚辛兩線等第八題圜外任取一㸃從㸃任出幾線其至規内則過圜心線最大餘線愈離心愈小其至規外則過圜心線為徑之餘者最小餘線愈近徑餘愈小而諸線中止兩線等解曰乙丙丁戊圜之外從甲㸃任出幾線其一為過癸心之甲壬其餘為甲辛為甲庚為甲巳皆至規内規内線者如車輻之指牙題先言過心之甲壬最大次言近心之甲辛大于離心之甲庚甲庚又大于甲巳三反上言規外之甲乙為乙壬徑餘者規外線者如車輻之湊轂最小四言甲丙近徑餘小于甲丁甲丁又小于甲戊後言甲乙兩旁止可出兩線等先論曰試從癸心至丙丁戊巳庚辛各出直線其甲癸辛角形之甲癸癸辛兩邊并大于甲辛一邊一卷二十而甲癸癸辛與甲壬等則甲壬大于甲辛依顯甲壬更大于甲庚甲巳而過心之甲壬最大次論曰甲癸辛角形之癸辛與甲癸庚角形之癸庚兩邊等甲癸同邊而甲癸辛角大于甲癸庚角全大于分則對大角之甲辛邊大于對小角之甲庚邊一卷廿四依顯甲庚大于甲巳而規内線愈離心愈小三論曰甲癸丙角形之甲癸一邊小于甲丙丙癸兩邊并一卷二十次每減一相等之乙癸丙癸則甲乙小于甲丙矣依顯甲乙更小于甲丁甲戊而規外甲乙最小四論曰甲丁癸角形之内從甲與癸出甲丙丙癸兩邊并小于甲丁丁癸兩邊并一卷廿一此二率者每減一相等之丙癸丁癸則甲丙小于甲丁矣依顯甲丙更小于甲戊而愈近徑餘甲乙者愈小後論曰試依乙癸丙作乙癸子相等角抵圜界次作甲子線其甲子癸角形之甲癸癸子兩腰與甲癸丙角形之甲癸癸丙兩腰各等而兩腰間角又等則對等角之甲子甲丙兩底亦等也一卷四此外若有從甲出線在子之上即依第四論小于甲丙在子之下即大于甲丙故云甲乙兩旁止可出甲丙甲子兩線等第九題圜内從一㸃至界作三線以上皆等即此㸃必圜心解曰從甲㸃至乙丙丁圜界作甲乙甲丙甲丁三直線若等題言甲㸃為圜心三以上等者更不待論論曰試于乙丙丙丁界作乙丙丙丁兩直線相聨此兩線各兩平分于戊于巳從甲出兩直線為甲戊為甲巳其甲乙戊角形之甲乙與甲戊丙角形之甲丙兩腰既等甲戊同腰乙戊戊丙兩底又等即甲戊乙與甲戊丙兩角亦等一卷八為兩直角依顯甲巳丙甲巳丁亦等為兩直角則甲戊甲巳之分乙丙丙丁俱平分為直角而此兩線俱為函心線本篇一之系定相遇于甲甲為圜心矣又論曰若言甲非心心在于戊者令戊甲相聨引作巳庚徑線即甲是戊心外所取一㸃而從甲所出線愈近心者宜愈大矣本篇七則甲丁宜大于甲丙而先設等何也第十題兩圜相交止于兩㸃論曰若言甲乙丙丁戊巳圜與甲庚乙丁辛戊圜三相交于甲于乙于丁令作甲乙乙丁兩直線相聯此兩線各兩平分于壬于癸次從壬癸作子壬子癸兩垂線其子壬分甲乙子癸分乙丁既皆兩平分而各為兩直角即子壬子癸兩線俱為甲庚乙丁辛戊圜之函心線本篇一之系而子為其心矣依顯甲乙丙丁戊巳圜亦以子為心也夫兩交之圜尚不得同心本篇五何縁得有三交又論曰若言兩圜三相交于甲于乙于丁令先尋甲庚乙丁辛戊圜之心于壬本篇一次從心至三交界作壬甲壬乙壬丁三線此三線等也一卷界説十五又甲乙丙丁戊巳圜内有從壬出之壬甲壬乙壬丁三相等線則壬又為甲乙丙丁戊巳圜之心本篇九不亦交圜同心乎本篇五第十一題兩圜内相切作直線聯兩心引出之必至切界解曰甲乙丙甲丁戊兩圜内相切于甲而巳為甲乙丙之心庚為甲丁戊之心題言作直線聨庚巳兩心引抵圜界必至甲論曰如云不至甲而截兩圜界于乙丁及丙戊令從甲作甲巳甲庚兩線其甲巳庚角形之庚巳巳甲兩邉并大于庚甲一邉一卷二十而同圜心所出之庚甲庚丁宜等即庚巳巳甲大于庚丁矣此二率者各減同用之庚巳即巳甲亦大于巳丁矣夫巳甲與巳乙是内圜同心所出等線則巳乙亦大于巳丁而分大于全也可乎若曰庚為甲乙丙心巳為甲丁戊心亦依前轉説之甲巳庚角形之巳庚庚甲兩邉并大于甲巳一邉一卷二十而同圜心所出之巳甲巳戊宜等即巳庚庚甲大于巳戊矣此二率者各減同用之巳庚即庚甲大于庚戊矣夫庚甲與庚丙是内圜同心所出等線則庚丙亦大于庚戊而分大于全也可乎第十二題兩圜外相切以直線聯兩心必過切界解曰甲乙丙丁乙戊兩圜外相切于乙其甲乙丙心為巳丁乙戊心為庚題言作巳庚直線必過乙論曰如云不然而巳庚線截兩圜界于戊于丙令于切界作乙巳乙庚兩線其乙巳庚角形之巳乙乙庚兩邊并大于巳庚一邊而乙庚與庚戊乙巳與巳丙俱同心所出線宜各等即庚戊丙巳兩線并亦大于庚巳一線矣一卷二十夫庚巳線分為庚戊丙巳尚餘丙戊而云庚戊丙巳大于庚巳則分大于全也故直線聨巳庚必過乙第十三題二支圜相切不論内外止以一㸃先論曰甲乙丙丁與甲戊丙巳兩圜内相切若云有兩㸃相切于甲又于丙令作直線函兩圜心庚辛引出之如前圖宜至相切之甲之丙本篇十一則甲丙為兩圜之同徑矣而此徑線者兩平分于庚又兩平分于辛何也一直線止以一㸃兩平分若云庚辛引出直線一抵甲一截兩圜之界于癸于壬即如後圖令從兩心各作直線至又相切之丙次問之甲乙丙丁圜之心為庚邪辛邪如曰庚也而辛為甲戊内巳之心則丙庚辛角形之庚辛辛丙兩邊并大于庚丙一邊一卷二十而庚辛辛丙與庚癸宜等辛癸辛丙同圜心所出故即庚癸亦大于庚丙矣夫庚丙與庚壬者外圜同心所出等線也將庚癸亦大于庚壬可乎如曰辛也而庚為甲戊丙巳之心則丙庚辛角形之辛庚庚丙兩邊并大于辛丙一邊一卷二十而辛丙與辛甲宜等即辛庚庚丙亦大于辛甲矣此二率者各減同用之辛庚即庚丙亦大于庚甲也夫庚甲與庚丙者亦同圜心所出等線也而安有大小後論曰甲乙與乙丙兩圜外相切于巳從甲乙之丁心丙乙之戊心作直線相聨必過巳本篇十三若云又相切于乙令自乙至丁至戊各作直線其丁乙乙戊并宜與丁戊等而為角形之兩腰又宜大于丁戊一卷二十則兩圜相切安得兩㸃又後論曰更令于兩相切之乙之巳作直線相聨其直線當在甲乙圜内本篇二又當在乙丙圜内何所置之第十四題二支圜内兩直線等即距心之逺近等距心之逺近等即兩直線等先解曰甲乙丙丁圜其心戊圜内甲乙丁丙兩線等題言兩線距戊心逺近亦等論曰試從戊心向甲乙作戊巳向丁丙作戊庚各垂線次自丁自甲至戊各作直線其戊巳戊庚既各分甲乙丁丙線為兩平分本篇三而甲乙丁丙等則平分之甲巳丁庚亦等夫甲戊上直角方形與甲巳巳戊上兩直角方形并等一卷四七等甲戊之丁戊上直角方形與丁庚庚戊上兩直角方形并等而甲巳丁庚上兩直角方形既等即戊巳戊庚上兩直角方形亦等則戊巳戊庚兩線亦等是甲乙丁丙兩線距心之度等本卷界説四後解曰甲乙丁丙兩線距戊心逺近等題言甲乙丁丙兩線亦等論曰依前論從戊作戊巳戊庚兩垂線既等本卷界説四而分甲乙丁丙各為兩平分本篇三其甲戊上直角方形與甲已巳戊上兩直角方形并等一卷四七等甲戊之丁戊上直角方形與丁庚庚戊上兩直角方形并等即甲巳巳戊上兩直角方形并與丁庚庚戊上兩直角方形并亦等此二率者每減一相等之巳戊戊庚上直角方形即所存甲巳丁庚上兩直角方形亦等是甲巳丁庚兩線等也夫甲乙倍甲巳丁丙倍丁庚其半等其全必等第十五題徑為圜内之大線其餘線者近心大于逺心解曰甲乙丙丁戊巳圜其心庚其徑甲巳其近心線為辛壬逺心線為丙丁題言甲乙最大辛壬近心大于丙丁逺心論曰試從庚向丙丁作庚癸向辛壬作庚子各垂線其丙丁距心逺于辛壬即庚癸大于庚子本卷界説四次于庚癸線截庚丑與庚子等次從丑作乙戊為庚癸之垂線末于庚乙庚丙庚丁庚戊各作直線相聯其庚丑既等于庚子即乙戊與辛壬各以垂線距心逺近等本卷界説四而兩線亦等本篇十四夫庚乙庚戊并大于乙戊一卷二十而與甲巳等即甲巳大于乙戊亦大于辛壬矣依顯甲巳大于他線則甲巳最大又乙庚戊角形之乙庚庚戊兩腰與丙庚丁角形之丙庚庚丁兩腰等而乙庚戊角大于丙庚丁角則乙戊底大于丙丁底一卷廿四故等乙戊之辛壬亦大于丙丁也是近心線大于逺心線也第十六題三支圜徑末之直角線全在圜外而直線偕圜界所作切邊角不得更作一直線入其内其半圜分角大于各直線鋭角切邊角小于各直線鋭角先解曰甲乙丙圜丁為心甲丙為徑從甲作甲丙之垂線題言此線全在圜外論曰若言在内如甲乙令自丁至乙作直線即丁甲乙與丁乙甲兩角等一卷五丁甲既為直角丁乙又為直角乎夫角形三角并等兩直角一卷十七豈得形内自有兩直角也則垂線必在圜外若巳戊必不在圜内若甲乙又不在圜界之上如云在界亦依此論故曰全在圜外次解曰題又言戊甲垂線偕乙甲圜界所作切邊角不得更作一直線入其内論曰若云可作如庚甲令從丁心向庚甲作丁辛為庚甲之垂線一卷十二夫丁甲辛角形之丁甲辛丁辛甲兩角并小于兩直角一卷十七而丁辛甲為直角即對小角之丁辛線小于對大角之甲丁線矣一卷十九甲丁者與丁壬為同圜相等者也將丁壬亦大于丁辛乎則戊甲乙角之内不得更作一直線而戊甲之下但有直線必入本圜之内也後解曰題又言丁甲垂線偕乙甲圜界所作丙甲乙圜分角大于各直線鋭角而戊甲垂線偕乙甲圜界所作切邊角小于各直線鋭角論曰依前論甲戊下有直線既云必入圜内即此直線偕戊甲所作各直線鋭角皆小于圜分角而切邊角小于各直線鋭角系巳甲線必切圜以一㸃増先解曰甲乙丙圜其心丁其徑甲丙從甲作戊甲為甲丙之垂線題言戊甲全在圜外増正論曰増正論曰増題解曰第十七題設一㸃一圜求從㸃作切線法曰甲㸃求作直線切乙丙圜其圜心丁先從甲作甲丁直線截乙丙圜于乙次以丁為心甲為界作甲戊圜次從乙作甲丁之垂線而遇甲戊圜于戊次作戊丁直線而截乙丙圜于丙末作甲丙直線即切乙丙圜于丙論曰乙戊丁角形之戊丁丁乙兩腰與甲丙丁角形之甲丁丁丙兩腰各等一卷界説十五丁角同即甲丙乙戊兩底亦等一卷四而戊乙丁為直角即甲丙丁亦直角則甲丙偕乙丙圜之半徑丁丙為一直角矣豈非圜之切線本篇十六之系第十八題直線切圜從圜心作直線至切界必為切線之垂線解曰甲乙直線切丙丁圜于丙從戊心至切界作戊丙線題言戊丙為甲乙之垂線論曰如云不然令從戊别作垂線如至巳而截丙丁圜于丁其丙戊巳角形之戊巳丙既為直角即宜大于巳丙戊角一卷十七而對大角之戊丙邊宜大于對小角之戊巳邊矣一卷十九夫戊丙與戊丁等也戊丙大于戊巳則戊丁亦大于戊巳乎又論曰若云丙非直角即其兩旁角一鋭一鈍令乙丙戊為鋭角則鋭角乃大于半圜分角乎本篇十六第十九題直線切圜圜内作切線之垂線則圜心必在垂線之内解曰甲乙線切丙丁戊圜于丙圜内作戊丙為甲乙之垂線題言圜心在戊丙線内論曰如云不然心在于巳令從巳作巳丙直線即巳丙亦為甲乙之垂線本篇十八而巳丙甲與戊丙甲等為直角是全與其分等矣第二十題負圜角與分圜角所負所分之圜分同則分圜角必倍大于負圜角解曰甲乙丙圜其心丁有乙丁丙分圜角乙甲丙負圜角同以乙丙圜分為底題言乙丁丙角倍大于乙甲丙角先論分圜角在乙甲甲丙之内者曰如上圖試從甲過丁心作甲戊線其甲丁乙角形之丁甲丁乙等即丁甲乙丁乙甲兩角等一卷五而乙丁戊外角與内相對兩角并等一卷卅二即乙丁戊倍大于乙甲丁矣依顯丙丁戊亦倍大于丙甲丁則乙丁丙全角亦倍大于乙甲丙全角次論分圜角不在乙甲甲丙之内而甲乙線過丁心者曰如上圖依前論推顯乙丁丙外角等于内相對之丁甲丙丁丙甲兩角并一卷卅二而丁甲丁丙兩腰等即甲丙兩角亦等一卷五則乙丁丙角倍大于乙甲丙角後論分圜角在負圜角線之外而甲乙截丁丙者曰如上圖試從甲過丁心作甲戊線其戊丁丙分圜角與戊甲丙負圜角同以戊乙兩圜分為底如前次論戊丁丙角倍大于戊甲丙角依顯戊丁乙分圜角亦倍大于戊甲乙負圜角次于戊丁丙角減戊丁乙角戊甲丙角減戊甲乙角則所存乙丁丙角必倍大于乙甲丙角増若乙丁丁丙不作角于心或為半圜或小于半圜則丁心外餘地亦倍大于同底之負圜角論曰第二十一題凡同圜分内所作負圜角俱等解曰甲乙丙丁圜其心戊于丁甲乙丙圜分内任作丁甲丙丁乙丙兩角題言此兩角等先論函心大分所作曰試從戊作戊丁戊丙線其丁戊丙分圜角既倍大于丁甲丙角丁乙丙本篇十二即甲乙兩角自相等公論七後論半圜分不函心小分所作曰丁甲乙丙或為半圜分或為不函心小分俱從甲從乙過戊作甲巳乙庚兩線若不函心更從戊作戊丁戊丙兩線其丁戊巳分圜角既倍大于丁甲巳負圜角本篇二十依顯丙戊巳分圜角亦倍大于丙甲巳負圜角而丁戊庚庚戊巳兩角與丁戊巳一角等則丁戊庚庚戊巳巳戊丙三角必倍大于丁甲丙依顯此三角亦倍大于丁乙丙則丁甲丙丁乙丙兩角自相等又後論曰二十題増言分圜不作角其心外餘地倍大于同底各負圜角即各角自相等又後論曰甲丙乙丁線交羅相遇為巳試作甲乙線相聯其甲丁巳角形之三角并與乙丙巳角形之三角并等一卷卅二次每減一交角相等之甲巳丁乙巳丙一卷十五即巳甲丁巳丁甲兩角并與巳丙乙巳乙丙兩角并等矣而甲丁乙乙丙甲兩角同在甲丁丙乙函心大分内又等本題第一論則丁甲丙與丙乙丁亦等又後論曰丁丙之外任取一界為巳作丁巳丙巳兩線令俱函心而丁甲乙丙巳與丙乙甲丁巳俱為大分次于甲巳乙巳各作直線相聨其丁甲巳與丁乙巳兩角同負于甲乙丙巳圜界即等本題第一論依顯丙乙巳與丙甲巳兩角同負丙乙甲丁巳圜界又等此二相等率并之則丁甲丙丁乙丙兩全角亦等第二十二題圜内切界四邊形每相對兩角并與兩直角等解曰甲乙丙丁圜其心戊圜内有甲乙丙丁四邊形題言甲乙丙丙丁甲兩角并乙丙丁丁甲乙兩角并各與兩直角等論曰試作甲丙乙丁兩對角線其甲乙丁甲丙丁兩角同負甲乙丙丁圜分即等本篇廿一依顯丙甲丁丙乙丁兩角亦等則甲乙丁丙乙丁兩角并為甲乙丙一角與甲丙丁丙甲丁兩角并等次每加一丙丁甲角即甲乙丙丙丁甲并與甲丙丁丙甲丁丙丁甲三角并等此三角并元與兩直角等一卷卅二則甲乙丙丙丁甲相對兩角并與兩直角等依顯乙丙丁丁甲乙并亦與兩直角等第二十三題一直線上作兩圜分不得相似而不相等論曰如云不然令于甲乙線上作同方兩圜分相似而不相等必作甲丙乙又作甲丁乙其兩圜相交止于甲乙兩㸃本篇十即一圜分全在内一圜分全在外矣次令作甲丁線截甲丙乙圜于丙末令作丙乙丁乙兩線相聨夫兩圜分相似者其負圜角宜等本卷界説十則乙丙甲外角與相對之乙丁甲内角等乎一卷十六第二十四題相等兩直線上作相似兩圜分必等解曰甲乙丙丁兩線上作甲丙乙丙巳丁相似兩圜分題言兩圜分等論曰甲乙丙丁兩線既等試以甲乙線加丙丁線上兩線必相合即甲丙乙丙巳丁兩圜分相加亦相合如云不然必兩圜分相加或在内或在外或半在内半在外矣若在内在外即一直線上有兩圜分相似而不相等也本篇廿三若半在内半在外即兩圜三相交也本篇十兩俱不可故相似者必等第二十五題有圜之分求成圜法曰甲乙丙圜分求成圜先于分之兩端作甲丙線次作乙丁為甲丙之垂線次作甲乙線相聯其丁乙甲角或大于丁甲乙角或等或小若大即甲乙丙當為圜之小分何也乙丁分甲丙為兩平分即知圜之心必在乙丁線内本篇一之系而心在丁㸃之外則從丁㸃所出丁乙為不過心徑線至小本篇七故對小邊之丁甲乙角小于對大邊之丁乙甲角也一卷十八即作乙甲戊角與丁乙甲角等次從乙丁引出一線與甲戊線遇于戊即戊為圜心論曰試從戊作戊丙線其甲丁戊角形之甲丁線與丙丁戊角形之丙丁線等丁戊同線而甲丁戊丙丁戊兩皆直角即對直角之甲戊與戊丙兩線等一卷四夫甲戊與乙戊以對角等故既等一卷六戊丙與甲戊又等則從戊至界三線皆等而戊為心本篇九次法兼論曰若丁乙甲丁甲乙兩角等即甲乙丙為半圜而甲丙為徑丁為心何也丁乙丁甲兩邊等然後丁乙甲丁甲乙兩角等一卷五今丁乙甲丁甲乙兩角既等即丁乙丁甲兩線必等一卷六丁丙元與丁甲等則從丁所出三線等而丁為圜心本篇九後法曰若丁乙甲小于丁甲乙即甲乙丙當為圜大分何也乙丁分甲丙為兩平分即知圜心在乙丁線内本篇一之系而丁㸃在心之外則所出丁乙為過心徑線至大本篇七故對大邊之丁甲乙大于對小邊之丁乙甲也一卷十八即作乙甲戊角與丁乙甲角等而甲戊線與乙丁線遇于戊即戊為圜心論曰試從戊作戊丙線其甲丁戊角形之甲丁線與丙丁戊角形之丙丁線等丁戊同線而甲丁戊丙丁戊兩皆直角即對直角之甲戊戊丙兩線亦等一卷四夫乙戊與甲戊以對角等故既等一卷五戊丙與甲戊亦等則從戊至界三線皆等而戊為心本篇九増求圜分之心有一簡法于甲乙丙圜分任取三㸃于甲于乙于丙以兩直線聯之各兩平分于丁于戊從丁從戊作甲乙乙丙之各垂線為巳丁為巳戊而相遇于巳即巳為圜心第二十六等圜之乘圜分角或在心或在界等其所乘之圜分亦等先解在心者曰甲乙丙丁戊巳兩圜等其心為庚為辛有甲庚丙與丁辛巳兩乘圜角等題言所乘之甲丙丁巳兩圜分亦等論曰試于甲乙丙丁戊巳兩圜分之上任取兩㸃于乙于戊從乙作乙甲乙丙從戊作戊丁戊巳各兩線次作甲丙丁巳兩線相聯其乙與戊兩角既各半于庚辛兩角即乙與戊自相等本篇二十而所負甲乙丙與丁戊巳兩圜分相似本卷界説十又甲庚丙角形之甲庚庚丙兩邊與丁辛巳角形之丁辛辛巳兩邊各等庚角與辛角又等即甲丙與丁巳兩邊亦等一卷四而相似之甲乙丙與丁戊巳兩圜分在等線上亦等本篇卄四夫相等圜減相等圜分則所存甲丙丁巳兩圜分亦等故云等角所乗之圜分等後解在界者曰兩圜之乙與戊兩乘圜角等題言所乘之甲丙丁巳兩圜分亦等論曰乙戊兩角既等而庚辛兩角各倍于乙戊即庚辛自相等本篇二十依前論甲丙丁巳兩邊亦自相等而甲乙丙與丁戊巳兩圜分亦等本篇廿四今于相等圜減相等圜分則所存甲丙丁巳兩圜分亦等注曰在心之乘圜角即分圜角隨類異名第二十七題二支等圜之角所乘圜分等則其角或在心或在界俱等先解在心者曰甲乙丙丁戊巳兩圜等其心為庚為辛若甲庚丙乘圜角所乘之甲丙分與丁辛巳所乘之丁巳分等題言甲庚丙丁辛巳兩角等論曰如云不然而庚大于辛令作甲庚壬角與丁辛巳角等即甲壬圜分宜與丁巳圜分等本篇廿六而甲丙與丁巳元等則甲壬與甲丙亦等乎後解在界者曰甲丙丁巳兩圜分等題言其上乙戊兩角亦等論曰如云不然而乙大于戊令作甲乙壬角與戊角等其甲乙壬與丁戊巳若等即所乘之甲壬丁巳宜等本篇廿六而甲丙與丁巳元等則甲壬與甲丙亦等乎増題從此推顯兩直線不相交而在一圜之内若兩線界相去之圜分等則兩線必平行若兩線平行則兩線界相去之圜分等先解曰甲乙丙丁圜内有甲丁乙丙兩線其相去之甲乙丁丙兩圜分等題言兩線必平行第二十八題等圜内之直線等則其割本圜之分大與大小與小各等解曰甲乙丙丁戊巳兩圜等其心為庚為辛圜内有甲丙丁巳兩直線等題言甲乙丙與丁戊巳兩大分甲丙與丁巳兩小分各等論曰試于甲庚庚丙丁辛辛巳各作直線其甲庚丙角形之甲丙與丁辛巳角形之丁巳兩底既等而甲庚庚丙兩腰與丁辛辛巳兩腰又等即庚辛兩角亦等一卷八其所乘之甲丙丁巳兩小分必等本篇廿六次減相等之甲丙丁巳兩小分則所存甲乙丙丁戊巳兩大分亦等第二十九題等圜之圜分等則其割圜分之直線亦等解曰依前題兩圜之甲乙丙丁戊巳兩圜分等而甲丙丁巳兩圜分亦等題言甲丙丁巳兩線必等論曰依前題作四線其甲庚丙角形之甲庚庚丙兩腰與丁辛巳角形之丁辛辛巳兩腰等而庚辛兩角所乘之甲丙丁巳兩圜分等即庚辛兩角亦等本篇廿七而對等角之甲丙丁巳兩線必等一卷四注曰第三十題有圜之分求兩平分之法曰甲乙丙圜分求兩平分先于分之兩界作甲丙線次兩平分于丁從丁作乙丁為甲丙之垂線即乙丁分甲乙丙圜分為兩平分論曰從乙作乙甲乙丙兩線其甲乙丁角形之甲丁與丙乙丁角形之丙丁兩腰等丁乙同腰而甲丁乙與丙丁乙兩直角又等即對直角之甲乙乙丙兩底亦等一卷四而甲乙與乙丙兩圜分亦等本篇十八則甲乙丙圜界兩平分于乙矣第三十一題五支負半圜角必直角負大分角小于直角負小分角大于直角大圜分角大于直角小圜分角小于直角解曰甲乙丙圜其心丁其徑甲丙于半圜分内任作甲乙丙角形即甲乙丙角負甲乙丙半圜分乙甲丙角負乙甲丙大分又任作乙戊丙角負乙戊丙小分題先言負半圜之甲乙丙為直角二言負大分之乙甲丙角小于直角三言負小分之乙戊丙角大于直角四言丙乙甲大圜分角大于直角後言丙乙戊小圜分角小于直角先論曰試作乙丁線次以甲乙線引長之至巳其丁乙丁甲兩線等即丁乙甲丁甲乙兩角等一卷五依顯丁乙丙丁丙乙兩角亦等而甲乙丙全角與乙甲丙甲丙乙兩角并等又巳乙丙外角亦與相對之乙甲丙甲丙乙兩内角并等一卷卅二則巳乙丙與甲乙丙等為直角二論曰甲乙丙角形之甲乙丙既為直角則乙甲丙小于直角一卷十七三論曰甲乙戊丙四邊形在圜之内其乙甲丙乙戊丙相對兩角并等兩直角本篇廿二而乙甲丙小于直角則乙戊丙大于直角四論曰甲乙丙直角為丙乙甲大圜分角之分則大于直角後論曰丙乙戊小圜分角為巳乙丙直角之分則小于直角此題别有四解四論先解曰甲乙丙半圜其心丁其上任作甲乙丙角題言此為直角論曰試作乙丁線其丁乙丁甲兩線既等即丁乙甲丁甲乙兩角亦等一卷五而乙丁丙外角既與丁乙甲丁甲乙相對之兩内角并等一卷卅二即倍大于丁乙甲角依顯乙丁甲外角亦倍大于丁乙丙角即乙丁甲乙丁丙兩角并亦倍大于甲乙丙角夫乙丁甲乙丁丙并等兩直角一卷十三則甲乙丙為直角二解曰甲乙丙大圜分其心丁任作甲乙丙角題言此小于直角論曰試作甲丁戊徑線次作乙戊線相聯其甲乙戊既為直角本題一論即甲乙丙為其分而小于直角三解曰甲乙丙小圜分其心丁任作甲乙丙角題言此大于直角論曰試作甲丁戊徑線而引乙丙圜界至戊次作乙戊線其甲乙戊既負半圜之直角而為甲乙丙角之分則甲乙丙大于直角四五合解曰甲乙丙大圜分丙丁甲小圜分其心戊題言丙甲乙大圜分角大于直角丙甲丁小圜分角小于直角論曰試作乙戊丙徑線次作乙甲線引長之至巳其乙甲丙直角為丙甲乙大圜分角之分而丙甲丁小圜分角又為巳甲丙直角之分則大分角大于直角小分角小于直角一系凡角形之内一角與兩角并等其一角必直角何者其外角與内相對之兩角等則與外角等之内交角豈非直角二系大分之角大于直角小分之角小于直角終無有角等于直角又從小過大從大過小非大即小終無相等依此題四五論甚明與本篇十六題増注互相發也第三十二題直線切圜從切界任作直線割圜為兩分分内各任為負圜角其切線與割線所作兩角與兩負圜角交互相等解曰甲乙線切丙丁戊圜于丙從丙任作丙戊直線割圜為兩分兩分内任作丙丁戊丙庚戊兩負圜角題言甲丙戊角與丙庚戊角乙丙戊角與丙丁戊角交互相等先論割圜線過心者曰如前圖甲丙戊乙丙戊兩皆直角一卷十八而丙庚戊丙丁戊兩負半圜角亦皆直角本篇卅一則交互相等後論割圜線不過心者曰如後圖試作丙巳過心直線次作戊巳線相聯其巳丙為甲乙之垂線一卷十八而丙戊巳為直角本篇卅一即戊丙巳戊巳丙兩角并等于一直角亦等于甲丙巳角矣此兩率者各減同用之戊丙巳角即所存戊巳丙與甲丙戊等也夫戊巳丙與丙庚戊元等本卷廿一則甲丙戊與丙庚戊交互相等又丙丁戊庚四邊形之丙丁戊丙庚戊兩對角并等兩直角本篇廿二而甲丙戊乙丙戊兩交角亦等兩直角一卷十三此二率者各減一相等之甲丙戊丙庚戊則所存丙丁戊乙丙戊亦交互相等第三十三題一線上求作圜分而負圜分角與所設直線角等先法曰設甲乙線丙角求線上作圜分而負圜分角與丙等其丙角或直或鋭或鈍若直角先以甲乙兩平分于丁次以丁為心甲乙為界作半圜圜分内作甲戊乙角即負半圜角為直角本篇卅一如所求次法曰若設丙鋭角先于甲㸃上作丁甲乙鋭角與丙等次作戊甲為甲丁之垂線于甲乙之上次作巳乙甲角與巳甲乙角等而乙巳線與甲戊線遇于巳即巳乙巳甲兩線等一卷六末以巳為心甲為界作甲庚圜必過乙即甲庚乙圜分内甲乙線上所作負圜角必為鋭角而與丙等論曰試作甲庚乙角其甲巳戊線過巳心而丁甲又為戊甲之垂線即丁甲線切甲庚乙圜于甲本篇十六之系則丁甲乙與甲庚乙兩角交互相等本篇卅二如所求後法曰若設辛鈍角依前作壬甲乙鈍角與辛等次作戊甲為壬甲之垂線餘倣第二法而于甲乙線上作甲癸乙角即與辛等後論同次第三十四題設圜求割一分而負圜分角與所設直線角等法曰設甲乙丙圜求割一分而負圜分角與丁等先作戊巳直線切圜于甲本篇十七次作巳甲乙角與丁等即割圜之甲乙線上所作甲丙乙角負甲丙乙圜分而與丁等何者巳甲乙角與丁等亦與甲丙乙交互相等故本篇卅二第三十五題圜内兩直線交而相分各兩分線矩内直角形等解曰甲丙乙丁圜内有甲乙丙丁兩線交而相分于戊題言甲戊偕戊乙與丙戊偕戊丁兩矩内直角形等其兩線或俱過心或一過心一不過心或俱不過心若俱過心者其各分四線等即兩矩内直角形亦等先論曰圜内線獨丙丁過巳心者又有二種其一丙丁平分甲乙線于戊即丙戊線在甲乙上為兩直角本篇三試作巳乙線相聯其丙丁線既兩平分于巳又任兩分于戊即丙戊偕戊丁矩内直角形及巳戊上直角方形并與等巳丁之巳乙上直角方形等二卷五夫巳乙上直角方形與巳戊戊乙上兩直角方形并等一卷四七即丙戊偕戊丁矩内直角形及巳戊上直角方形并與巳戊戊乙上兩直角方形并亦等矣次每減同用之巳戊上直角方形則所存丙戊偕戊丁矩内直角形不與戊乙上直角方形等乎戊乙與甲戊既等即甲戊偕戊乙矩内直角形與丙戊偕戊丁矩内直角形亦等次論曰若丙丁任分甲乙線于戊即以甲乙線兩平分于庚次于庚巳巳乙各作直線相聯即巳庚為甲乙之垂線而成兩直角本篇三其丙戊偕戊丁矩内直角形及巳戊上直角方形并與等巳丁之巳乙上直角方形等二卷五而巳戊上直角方形與巳庚庚戊上兩直角方形并等一卷四七巳乙上直角方形與巳庚庚乙上兩直角方形并亦等則丙戊偕戊丁矩内直角形及巳庚庚戊上兩直角方形并與巳庚庚乙上兩直角方形并等次每減同用之巳庚上直角方形即所存丙戊偕戊丁矩内直角形及庚戊上直角方形不與庚乙上直角方形等乎夫甲戊偕戊乙矩内直角形及庚戊上直角方形并亦與庚乙上直角方形等二卷五此二相等率者每減同用之庚戊上直角方形則丙戊偕戊丁與甲戊偕戊乙兩矩内直角形等矣後論曰圜内兩線俱不過心者又有二種或一線平分或兩俱任分皆從巳心與戊相聨作直線引長之為庚辛線依上論甲戊偕戊乙矩内直角形不論甲乙線平分任分皆與過心之庚戊偕戊辛矩内直角形等又依上論丙戊偕戊丁矩内直角形不論丙丁線平分任分亦與過心之庚戊偕戊辛矩内直角形等則甲戊偕戊乙與丙戊偕戊丁兩矩内直角形等第三十六題圜外任取一㸃從㸃出兩直線一切圜一割圜其割圜之全線偕規外線矩内直角形與切圜線上直角方形等解曰甲乙丙圜外任取丁㸃從丁作丁乙線切圜于乙本篇十七作丁甲線截圜界于丙題言甲丁偕丙丁矩内直角形與丁乙上直角方形等先論丁甲過戊心者曰試作乙戊線為丁乙之垂線本篇十八其甲丙線平分于戊又引出一丙丁線即甲丁偕丙丁矩内直角形及等戊丙之戊乙上直角方形并與戊丁上直角方形等二卷六而戊丁上直角方形與戊乙丁乙上兩直角方形并等一卷四七即甲丁偕丙丁矩内直角形及戊乙上直角方形與戊乙丁乙上兩直角方形并等此兩率者每減同用之戊乙上直角方形則所存甲丁偕丙丁矩内直角形與丁乙上直角方形等後論丁甲不過戊心者曰試以甲丙線兩平分于巳次從戊心作戊巳戊丙戊丁戊乙四線即戊乙為丁乙之垂線本篇十八戊巳為甲丙之垂線本篇三其甲丙線既兩平分于巳又引出一丙丁線即甲丁偕丁丙矩内直角形及巳丙上直角方形并與巳丁上直角方形等二卷六次每加一戊巳上直角方形即甲丁偕丁丙矩内直角形及巳丙戊巳上兩直角方形并與巳丁戊巳上兩直角方形并等夫巳丙戊巳上兩直角方形并與等戊丙之戊乙上直角方形等一卷四七而戊丁上直角方形與巳丁戊巳上兩直角方形并等即甲丁偕丁丙矩内直角形及戊乙上直角方形與戊丁上直角方形等矣又戊丁上直角方形與戊乙丁乙上兩直角方形并等即甲丁偕丁丙矩内直角形及戊乙上直角方形并與戊乙丁乙上兩直角方形并等次每減同用之戊乙上直角方形則所存甲丁偕丁丙矩内直角形與丁乙上直角方形等一系若從圜外一㸃作數線至規内各全線偕規外線矩内直角形俱等如從甲作甲丙甲丁甲戊各線截圜界于巳于庚于辛其甲丙偕巳甲甲丁偕庚甲甲戊偕辛甲各矩内直角形俱等何者試作甲乙切圜線則各矩線内直角形與甲乙上直角方形俱等故本題二系從圜外一㸃作兩直線切圜此兩線等如甲㸃作甲乙甲丙兩切圜線即甲丙與甲乙等何者試從甲作甲丁線截圜界于戊其甲乙甲丙上兩直角方形各與甲丁偕甲戊矩内直角形等本題則此兩直角方形自相等三系從圜外一㸃止可作兩直線切圜若言從甲既作甲乙甲丙兩線切圜又可作甲丁線亦切圜令從戊心作戊乙戊丁兩線即甲乙戊為直角而甲丁戊亦宜等為直角本篇十八試作甲戊直線則甲乙戊角形内有甲丁戊角應大于甲乙戊角一卷廿一安得為直角也又甲乙甲丁若俱切圜即兩線宜等本題二系試作甲戊線截圜于巳則甲丁為近巳線甚小當小于逺巳之甲乙線本篇八又安得相等也故一㸃上止可作切圜線兩也第三十七題圜外任于一㸃出兩直線一至規外一割圜至規内而割圜全線偕割圜之規外線矩内直角形與至規外之線上直角方形等則至規外之線必切圜解曰甲乙丙圜其心戊從丁㸃作丁乙至規外之線遇圜界于乙又作丁甲割圜至規内之線而截圜界于丙其丁甲偕丁丙矩内直角形與丁乙上直角方形等題言丁乙為切圜線論曰試從丁作丁巳線切圜于巳本篇十七次作戊乙戊巳兩線相聯若丁甲不過戊心者又作丁戊直線其丁巳上直角方形與丁甲偕丁丙矩内直角形等本篇卅六而丁乙上直角方形與丁甲偕丁丙矩内直角形亦等則丁乙丁巳上兩直角方形自相等而丁乙丁巳兩線亦等夫丁乙戊角形之丁乙乙戊與丁巳戊角形之丁巳巳戊各兩腰等丁戊同底即兩角形之三角各等一卷八而對丁戊底之丁巳戊為直角本篇十八即丁乙戊亦直角故丁乙為切圜線本篇十六之系
