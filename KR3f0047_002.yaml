body:
  text: 界説二則第一界凡直角形之兩邊函一直角者為直角形之矩線如甲乙偕乙丙函甲乙丙直角得此兩邊即知直角形大小之度今别作戊線巳線與甲乙乙丙各等亦即知甲乙丙丁直角形大小之度則戊偕巳兩線為直角形之矩線此例與算法通如上圖一邊得三一邊得四相乘得十二則三偕四兩邊為十二之矩數凡直角諸形之內四角皆直故不必更言四邊及平行線止名為直角形省文也凡直角諸形不必全舉四角止舉對角二字即指全形如甲乙丙丁直角形止舉甲丙或乙丁亦省文也第二界諸方形有對角線者其兩餘方形任偕一角線方形為磬折形甲乙丙丁方形任直斜角作甲丙對角線從庚點作戊巳辛壬兩線與方形邊平行而分本形為四方形其辛巳庚乙兩形為餘方形辛戊巳壬兩形為角線方形一卷界説三六兩餘方形任偕一角線方形為磬折形如辛巳庚乙兩餘方形偕巳壬角線方形同在癸子丑圜界內者是癸子丑磬折形也用辛戊角線方形倣此幾何原本第二卷之首終幾何原本第二卷本篇論線計十四題泰西利瑪竇口譯吳淞徐光啓筆受第一題兩直線任以一線任分為若干分其兩元線矩內直角形與不分線偕諸分線矩內諸直角形并等解曰甲與乙丙兩線如以乙丙三分之為乙丁丁戊戊丙題言甲偕乙丙矩線內直角形與甲偕乙丁甲偕丁戊甲偕戊丙三矩線內直角形并等論曰試作乙巳直角形在乙丙偕等甲之巳丙矩線內作法于乙界作庚乙丙界作巳丙兩垂線俱與甲等為平行次作庚巳直線與乙丙平行次于丁戊兩點作辛丁壬戊兩垂線與庚乙巳丙平行一卷卅三其辛丁與庚乙壬戊與巳丙既平行則辛丁與壬戊亦平行而辛丁壬戊與巳丙等即亦與甲等一卷卅四如此則乙辛直角形在甲偕乙丁矩線內丁壬直角形在甲偕丁戊矩線內戊巳直角形在甲偕戊丙矩線內并之則三矩內直角形與甲偕乙丙兩元線矩內直角形等注曰其説與算數最近故九卷之十四題俱以數明此十題之理今未及詳因題意難顯略用數明之如本題設兩數當兩線為六為十本篇一注曰以數明之設十數任兩分之為七為三十乘七為七十及十乘三為三十之兩小實與十自之百一大羃等第三題一直線任兩分之其元線任偕一分線矩內直角形與分餘線偕一分線矩內直角形及一分線上直角方形并等解曰甲乙線任兩分于丙題言元線甲乙任偕一分線如甲丙矩內直角形不論甲丙為長分為短分與分餘丙乙偕甲丙矩線內直角形及甲丙上直角方形并等論曰試作甲丁直角方形從乙界作乙巳垂線與甲戊平行一卷卅一而于戊丁引長之遇于巳其甲戊與甲丙等則甲巳直角形在元線甲乙偕一分線甲丙矩內丙丁與甲丙等則丙巳直角形在一分線甲丙偕分餘線丙乙矩內而甲巳直角形與甲丙丙乙矩線內丙巳直角形及甲丙上甲丁直角方形并等又論曰試别作丁線與一分線甲丙等其甲乙線既任分于丙則甲乙偕丁矩線內直角形即甲乙偕甲丙矩線內直角形與丁偕丙乙即甲丙偕丙乙丁偕甲丙即甲丙上直角方形兩矩線內直角形并等本篇一注曰注曰第五題一直線兩平分之又任兩分之其任兩分線矩內直角形及分內線上直角方形并與平分半線上直角方形等解曰甲乙線兩平分于丙又任兩分于丁其丙丁為分內線丙丁線者丙乙所以大于丁乙之較又甲丁所以大于甲丙之較故曰分內線題言甲丁丁乙矩線內直角形及分內線丙丁上直角方形并與丙乙線上直角方形等論曰試于丙乙線上作丙巳直角方形次作乙戊對角線從丁作丁庚線與乙巳平行遇對角線于辛次從辛作壬癸線與丙乙平行次從甲作甲子線與丙戊平行末從壬癸線引長之遇于子夫丁壬癸庚皆直角方形本篇四之系而辛丁與丁乙兩線等一卷卅四癸辛與丙丁兩線等則甲辛直角形在任分之甲丁丁乙矩線內而癸庚為分內線丙丁上直角方形也今欲顯甲辛直角形及癸庚直角方形并與丙巳直角方形等者于丙辛辛巳相等之兩餘方形一篇四三每加一丁壬直角方形即丙壬及丁巳兩直角形等矣而甲癸與丙壬兩形同在平行線內又底等即形亦等一卷卅六則甲癸與丁巳亦等也即又每加一丙辛直角形則丑寅卯罄折形豈不與甲辛等次于罄折形又加一癸庚直角方形豈不與丙巳直角方形等也而甲辛癸庚兩形并亦與丙巳等也則甲丁丁乙矩線內直角形及丙丁上直角方形并與丙乙上直角方形等注曰三者五所以大于二之較又八所以大于五之較二八之實十六三之羃九與五之羃二十五等注曰第七題一直線任兩分之其元線上及任用一分線上兩直角方形并與元線偕一分線矩內直角形二及分餘線上直角方形并等解曰甲乙線任分于丙題言元線甲乙上及任用一分線如甲丙上兩直角方形并不論甲丙為長分為短分與甲乙偕甲丙矩內直角形二及分餘線丙乙上直角方形并等論曰試于甲乙上作甲丁直角方形次作乙戊對角線從丙作丙巳線與乙丁平行遇對角線于庚末從庚作辛壬線與甲乙平行夫辛巳丙壬皆直角方形本篇四之系而辛庚與甲丙等一卷卅四即辛巳為甲丙上直角方形也又甲戊與甲乙等即甲巳直角形在甲乙偕甲丙矩線內也又戊丁丁壬與甲乙甲丙各等即辛丁直角形亦在甲乙偕甲丙矩線內也夫甲巳巳壬兩直角形即癸子丑罄折形及丙壬直角方形并本與甲丁直角方形等今于甲巳辛丁兩直角形并加一丙壬直角方形即與甲丁直角方形加一辛巳直角方形等矣則甲乙甲丙矩線內直角形二及丙乙上直角方形并與甲乙上直角方形及甲丙上直角方形并等也注曰以數明之設十數任分之為六為四如前圖十之羃百及六之羃三十六并與十六互乘之兩實百二十及四之羃十六等如後圖十之羃百及四之羃十六并與十四互乘之兩實八十及六之羃三十六等第八題一直線任兩分之其元線偕初分線矩內直角形四及分餘線上直角方形并與元線偕初分線上直角方形等解曰甲乙線任分于丙題言元線甲乙偕初分線丙乙矩內直角形四不論丙乙為長分為短分及分餘線甲丙上直角方形并與甲乙偕丙乙上直角方形等論曰試以甲乙線引增至丁而乙丁與丙乙等于全線上作甲戊直角方形次作丁巳對角線從乙作乙庚線與丁戊平行遇對角線于辛次從丙作丙壬線與甲巳平行遇對角線于癸次從辛作子丑線與甲丁平行遇丙壬于寅末從癸作卯辰線與戊巳平行遇乙庚于巳其卯壬寅巳乙丑俱角線方形一卷卅四之系而卯癸與甲丙兩線等一卷卅四即卯壬為甲丙上直角方形又寅辛與丙乙兩線等一篇卅四即寅巳為丙乙上直角方形與乙丑等丙乙與乙丁等故又乙辛辛巳兩線亦各與丙乙等而甲辛子巳兩直角形各在甲乙丙乙矩線內即等子辛與甲乙等故寅庚辛戊兩直角形亦各在甲乙丙乙矩線內即又等寅辛辛丑與丙乙乙丁等辛庚丑戊與等甲乙之子辛等故寅巳既與乙丑等而每加一癸庚即乙丑癸庚并與寅庚又等是甲辛一子巳二辛戊三乙丑四癸庚五五直角形并為午未申磬折形與元線甲乙偕初分線丙乙矩內直角形四等而午未申磬折形及卯壬直角方形本與甲戊直角方形等則甲乙乙丙矩線內直角形四及甲丙上直角方形并與甲乙偕丙乙上直角方形等注曰注曰注曰注曰第十二題三邊鈍角形之對鈍角邊上直角方形大于餘邊上兩直角方形并之較為鈍角旁任用一邊偕其引增線之與對角所下垂線相遇者矩內直角形二解曰甲乙丙三邊鈍角形甲乙丙為鈍角從餘角如甲下一垂線與鈍角旁一邊如丙乙之引增線遇于丁為直角題言對鈍角之甲丙邊上直角方形大于甲乙乙丙邊上兩直角方形并之較為丙乙偕乙丁矩線內直角形二反説之則甲乙乙丙上兩直角方形及丙乙偕乙丁矩線內直角形二并與甲丙上直角方形等論曰丙丁線既任分于乙即丙丁上直角方形與丙乙乙丁上兩直角方形及丙乙偕乙丁矩線內直角形二并等本篇四此二率者每加一甲丁上直角方形即丙丁甲丁上兩直角方形并與丙乙乙丁甲丁上直角方形三及丙乙偕乙丁矩線內直角形二并等也夫甲丙上直角方形等于丙丁甲丁上兩直角方形并一卷四七即亦等于丙乙乙丁甲丁上直角方形三及丙乙偕乙丁矩線內直角形二并也又甲乙線上直角方形既等于乙丁甲丁上兩直角方形并一卷四七即甲丙上直角方形與甲乙丙乙上兩直角方形及丙乙偕乙丁矩線內直角形二并等矣第十三題三邊鋭角形之對鋭角邊上直角方形小于餘邊上兩直角方形并之較為鋭角旁任用一邊偕其對角所下垂線旁之近鋭角分線矩內直角形二解曰甲乙丙三邊鋭角形從一角如甲向對邊乙丙下一垂線分乙丙于丁題言對甲丙乙鋭角之甲乙邊上直角方形小于乙丙甲丙邊上兩直角方形并之較為乙丙偕丁丙矩線內直角形二反説之則乙丙甲丙上兩直角方形并與甲乙上直角方形及乙丙偕丁丙矩線內直角形二并等論曰乙丙線既任分于丁即乙丙丁丙上兩直角方形并與乙丙偕丁丙矩線內直角形二及乙丁上直角方形并等本篇七此二率者每加一甲丁上直角方形即乙丙丁丙甲丁上直角方形三與乙丙偕丁丙矩線內直角形二及乙丁甲丁上兩直角方形并等也又甲丙上直角方形等于丁丙甲丁上兩直角方形并一卷四七即乙丙甲丙上兩直角方形并與乙丙偕丁丙矩線內直角形二及乙丁甲丁上兩直角方形并等也又甲乙上直角方形等于乙丁甲丁上兩直角方形并一卷四七即乙丙甲丙上兩直角方形并與乙丙偕丁丙矩線內直角形二及甲乙上直角方形并等反説之則甲乙上直角方形小于乙丙甲丙上兩直角方形并者為乙丙偕丁丙矩線內直角形二也注曰
