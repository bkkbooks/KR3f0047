  - {type: line-break, offset: 1586, content: '', id: KR3f0047_WYG_002-bkklb149}
  - {type: variant, offset: 1586, length: 0, content: '', WYG: 第六題一直線兩平分之又任引増一直線共為一全線其全線偕引増線矩内直角形及半元線上直角方形并與半元線偕引増線上直角方形等解曰甲乙線兩平分于丙又從乙引長之増乙丁與甲乙通為一全線題言甲丁偕乙丁矩線内直角形及半元線丙乙上直角方形并與丙丁上直角方形等論曰試于丙丁上作丙戊直角方形次作丁己對角線從乙作乙庚線與丁戊平行遇對角線于辛次從辛作壬癸線與丙丁平行次從甲作甲子線與丙己平行末從壬癸線引長之遇于子夫乙壬癸庚皆直角方形本篇四之系而乙丁與丁壬兩線等一卷卅四癸辛與丙乙兩線等則甲壬直角形在甲丁偕乙丁矩線内而癸庚為丙乙上直角方形也今欲顯甲壬直角形及癸庚直角方形并與丙戊直角方形等者試觀甲癸與丙辛兩直角形同在平行線内又底等即形亦等一卷卅六而丙辛與辛戊等一卷四三則辛戊與甲癸亦等即又每加一丙壬直角形則丑寅卯磬折形與甲壬等夫磬折形加一癸庚形本與丙戊直角方形等也即甲壬癸庚兩形并亦與丙戊等也則甲丁乙丁矩線内直角形及丙乙上直角方形并豈不與丙丁上直角方形等}
