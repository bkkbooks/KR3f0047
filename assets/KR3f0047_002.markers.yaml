  - {type: variant, offset: 3391, length: 0, content: '', WYG: 題中止論鋭角形不言直角鈍角形而直角鈍角形中俱有兩鋭角一卷十七卅二即對鋭角邊上形亦同此論如第二第三圖是但三鋭角形所作垂線任用一角而直角形必用直角鈍角形必用鈍角此為異耳直角鈍角形不用直角鈍角不能作垂線第十四題有直線形求作直角方形與之等法曰甲直線無法四邊形求作直角方形與之等先作乙丁形與甲等而直角一卷四五次任用一邊引長之如丁丙引之至己而丙己與乙丙等次以丁巳兩平分于庚其庚點或在丙點或在丙點之外若在丙即乙丁是直角方形與甲等矣葢丙己與乙丙等又與丙丁等而餘邊俱相等故乙丁為直角方形見一卷卅四若庚在丙外即以庚為心丁巳為界作丁辛巳半圜末從乙丙線引長之遇圜界于辛即丙辛上直角方形與甲等論曰試自庚至辛作直線其丁巳線既兩平分于庚又任兩分于丙則丁丙偕丙巳矩内直角形即乙丁直角形葢丙己與乙丙等故及庚丙上直角方形并與等庚巳之庚辛上直角方形等本篇五夫庚辛上直角方形等于庚丙丙辛上兩直角方形并一卷四七即乙丁直角形及庚丙上直角方形并與庚丙丙辛上兩直角方形并等次各減同用之庚丙上直角方形則丙辛上直角方形與乙丁直角形等増題凡先得直角方形之對角線所長于本形邊之較而求本形邊法曰直角方形之對角線所長于本形邊之較為甲乙而求本形邊先于甲乙上作甲丙直角方形次作乙丁對角線又引長之為丁戊線而丁戊與甲丁等即得乙戊線如所求論曰試于乙戊作戊己垂線從乙甲線引長之遇于己其乙戊己既直角而戊乙己為半直角一卷卅二即戊己乙亦半直角而戊乙與戊己兩邊等一卷六次作己庚與戊乙平行作乙庚與戊己平行即戊庚形為戊乙邊上直角方形也末作戊甲線即丁戊甲丁甲戊兩角等也一卷五夫乙戊己丁甲己既兩皆直角試每減一相等之丁戊甲丁甲戊角即所存己戊甲己甲戊兩角必等而己戊己甲兩邊必等一卷六則乙己對角線大于乙戊邊之較為甲乙矣此増不在本書因其方形故類附于此幾何原本卷二}
