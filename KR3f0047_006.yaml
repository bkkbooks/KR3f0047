body:
  text: 界説六則第一界凡形相當之各角等而各等角旁兩線之比例俱等為相似之形甲乙丙丁戊己兩角形之甲角與丁角等乙與戊丙與己各等其甲角旁之甲乙與甲丙兩線之比例若丁角旁之丁戊與丁己兩線而甲乙與乙丙若丁戊與戊己甲丙與丙乙若丁己與己戊則此兩角形為相似之形依顯凡平邉形皆相似之形如庚辛壬癸子丑俱平邉角形其各角俱等而各邉之比例亦等者是也四邉五邉以上諸形俱倣此第二界兩形之各兩邉線互為前後率相與為比例而等為互相視之形甲乙丙丁戊己庚辛兩方形其甲乙乙丙邉與戊己己庚邉相與為比例等而彼此互為前後如甲乙與戊己若己庚與乙丙也則此兩形為互相視之形依顯壬癸子丑寅卯兩角形之壬子與丑寅若丑卯與壬癸或壬癸與丑寅若丑卯與壬子亦互相視之形也第三界理分中末線者一線兩分之其全與大分之比例若大分與小分之比例甲乙線兩分之于丙而甲乙與大分甲丙之比例若大分甲丙與小分丙乙此為理分中末線其分法見本卷三十題而與二卷十一題理同名異此線為用甚廣至量體尤所必須十三卷諸題多賴之古人目為神分線也第四界度各形之髙皆以垂線之亘為度甲乙丙角形從甲頂向乙丙底作甲庚垂線即甲庚為甲乙丙之髙又丁戊己角形作丁辛垂線即丁辛為丁戊己之髙若兩形相視兩垂線等即兩形之髙必等如上兩形在兩平行線之內者是也若以丙己為頂以甲乙丁戊為底則不等自餘諸形之度髙俱倣此凡度物髙以頂底為界以垂線為度蓋物之定度止有一不得有二自頂至底垂線一而己偏線無數也第五界比例以比例相結者以多比例之命數相乘除而結為一比例之命數此各比例不同理而相聚為一比例者則用相結之法合各比例之命數求首尾一比例之命數也曷為比例之命數謂大幾何所倍於小幾何若干或小幾何在大幾何內若干也如大幾何四倍于小或小幾何為大四分之一即各以四為命比例之數也五卷界説三今言以彼多比例之命數相乘除而結為此一比例之命數者如十二倍之此比例則以彼二倍六倍兩比例相結也二六相乘為十二故也或以彼三倍四倍兩比例相結也三四相乘亦十二故也又如三十倍之此比例則以彼二倍三倍五倍三比例相結也二乘三為六六乘五為三十故也其曰相結者相結之理蓋在中率凡中率為前比例之後後比例之前故以二比例合為一比例則中率為輳合之因如兩爿合此為之膠如兩襟合此為之紐矣第五卷第十界言數幾何為同理之比例則第一與第三為再加之比例再加者以前中二率之命數再加為前後二率之命數亦以中率為紐也但彼所言者多比例同理故止以第一比例之命數纍加之此題所言則不同理之多比例不得以第一比例之命數纍加之故用此乘除相結之理于不同理之中求其同理别為纍加之法其紐結之義頗相類焉下文仍發明借象之術以需後用也五卷言多比例同理者第一與第三為再加與第四為三加與第五為四加以至無窮今此相結之理亦以三率為始三率則兩比例相乘除而中率為紐也若四率則先以前三率之兩比例相乘除而結為一比例復以此初結之比例與第三比例乘除相結為一比例也若五率則先以前三率之兩比例乘除相結復以此再結之比例與第三比例乘除相結又以三結之比例與第四比例乘除相結為一比例也或以第一第二第三率之兩比例乘除相結以第三第四第五之兩比例乘除相結又以此二所結比例乘除相結而為一比例也自六以上倣此以至無窮設三幾何為二比例不同理而合為一比例則以第一與二第二與三兩比例相結也如上圗三幾何二比例皆以大不等者其甲乙與丙丁為二倍大丙丁與戊己為三倍大則甲乙與戊己為六倍大二乘三為六也若以小不等戊己為第一甲乙為第三三乘二亦六則戊己與甲乙為反六倍大也甲乙與丙丁既二倍大試以甲乙二平分之為甲庚庚乙必各與丙丁等丙丁與戊己既三倍大而甲庚庚乙各與丙丁等即甲庚亦三倍大於戊己庚乙亦三倍大於戊己而甲乙必六倍大於戊己又如上圗三幾何二比例前以大不等後以小不等者中率小子前後兩率也其甲乙與丙丁為三倍大丙丁與戊己為反二倍大反二倍大者丙丁得戊己之半即甲乙與戊己為等帶半三乘半得等帶半也若以戊己為第一甲乙為第三反推之半除三為反等帶半也又如上圗三幾何二比例前以小不等後以大不等者中率大於前後二率也其甲乙與丙丁為反二倍大甲乙得丙丁之半丙丁與戊己為等帶三分之一即甲乙與戊己為反等帶半甲乙得戊己三分之二何者如甲乙二即丙丁當四丙丁四即戊己當三是甲乙二戊己當三也後增其乘除之法則以命數三帶得數一為四以半除之得二二比三為反等帶半也若以戊己為第一甲乙為第三三比二為等帶半也設四幾何為三比例不同理而合為一比例則以第一與二第二與三第三與四三比例相結也如上圗甲乙丙丁四幾何三比例先依上論以甲與乙乙與丙二比例相結為甲與丙之比例次以甲與丙丙與丁相結即得甲與丁之比例也如是遞結可至無窮也或用此圗申明本題之旨曰甲與乙之命數為丁乙與丙之命數為戊即甲與丙之命數為己何者三命數以一丁二戊相乘得三己即三比例以一甲與乙二乙與丙相乘得三甲與丙後增若多幾何各帶分而多寡不等者當用通分法如設前比例為反五倍帶三之二後比例為二倍大帶八之一即以前命數三通其五倍為十五得分數從之為十七是前比例為三與十七也以後命數八通其二倍為十六得分數從之為十七是後比例為十七與八也即首尾二幾何之比例為三與八得幾二倍大帶三之二也曷謂借象之術如上所説三幾何二比例者皆以中率為前比例之後後比例之前乘除相結略如連比例之同用一中率也而不同理别有二比例異中率者是不同理之斷比例也無法可以相結當于其所設幾何之外别立三幾何二比例而同中率者乘除相結作為儀式以彼異中率之四幾何二比例依倣求之即得故謂之借象術也假如所設幾何十六為首十二為尾却云十六與十二之比例若八與三及二與四之比例八為前比例之前四為後比例之後三與二為前之後後之前此所謂異中率也欲以此二比例乘除相結無法可通矣用是别立三幾何二比例如其八與三二與四之比例而務令同中率如三其八得二十四為前比例之前三其三得九為前比例之後即以九為後比例之前又求九與何數為比例若二與四得十八為後比例之後其二十四與九若八與三也九與十八若二與四也則十六與十二若二十四與十八俱為等帶半之比例矣是用借象之術變異中率為同中率乘除相結而合二比例為一比例也其三比例以上亦如上方所説展轉借象遞結之詳見本卷二十三題算算家所用借象金法雙金法俱本此第六界平行方形不滿一線為形小於線若形有餘線不足為形大於線甲乙線其上作甲戊丁丙平行方形不滿甲乙線而丙乙上無形即作己乙線與丁丙平行次引戊丁線遇己乙于己是為甲戊己乙滿甲乙線平行方形則甲丁為依甲乙線之有闕平行方形而丙己平行方形為甲丁之闕形又甲丙線上作甲戊己乙平行方形其甲乙邉大于元設甲丙線之較為丙乙而甲己形大于甲丙線上之甲丁形則甲己為依甲丙線之帶餘平行方形而丙己平行方形為甲己之餘形幾何原本卷六第一題等髙之三角形方形自相與為比例與其底之比例等解曰甲乙丙丁戊己兩角形等髙其底乙丙戊己丙庚戊辛兩方形等髙其底乙丙戊己題言甲乙丙與丁戊己之比例丙庚與戊辛之比例皆若乙丙與戊己論曰試置四形於庚辛子寅兩平行線內凡形自頂至底作垂線即本形之髙故等髙者必在平行線內見本卷界説四于乙子線內作數底線各與乙丙等為乙壬壬癸癸子于己寅線內作數底線各與戊己等為己丑丑寅次從甲從丁作甲壬甲癸甲子丁丑丁寅諸線其甲乙丙甲乙壬甲壬癸甲癸子四三角形既等底而在平行線內即等一卷三八依顯丁戊己丁己丑丁丑寅三三角形亦等則子丙底線大于乙丙若干倍而甲子丙角形大于甲乙丙亦若干倍依顯戊寅之倍戊己亦若丁戊寅之倍丁戊己底線分數與形之分數等故即用三試法若子丙底大于戊寅底則甲子丙形亦大于丁戊寅形也若等亦等若小亦小也一卷三八則一乙丙所倍之子丙三甲乙丙所倍之甲子丙與二戊己所倍之戊寅四丁戊己所倍之丁戊寅等大小皆同類也而一乙丙底與二戊己底之比例若三甲乙丙與四丁戊己矣五卷六界又丙庚戊辛兩方形各倍大于甲乙丙丁戊己兩角形一卷卅三而甲乙丙與丁戊己之比例既若乙丙與戊己即丙庚與戊辛兩方形之比例亦若乙丙與戊己兩底矣五卷十五或從壬癸子及丑寅各作直線與庚乙辛己平行即依上論推顯增題凡兩角形兩方形各等底其自相與為比例與戊己等兩角形等底又等髙即等依顯丁癸丑與丁戊己兩角形亦等第二題二支三角形任依一邉作平行線即此線分兩餘邉以為比例必等三角形內有一線分兩邉以為比例而等即此線與餘邉為平行先解曰甲乙丙角形內如作丁戊線與乙丙平行題言丁戊分甲乙甲丙于丁于戊以為比例必等者甲丁與丁乙若甲戊與戊丙也論曰試作丁丙戊乙兩線其丁戊乙丁戊丙兩角形同以丁戊為底同在兩平行線內即等一卷三七而甲戊丁與丁戊乙兩角形之比例若甲戊丁與丁戊丙矣五卷七夫甲戊丁與丁戊乙兩角形亦在兩平行線內若干戊點上作一線與甲乙平行即兩形在其內則甲戊丁與丁戊乙兩角形之比例若甲丁與丁乙兩底也本篇一依顯甲戊與戊丙兩底之比例亦若甲戊丁與丁戊丙兩角形也兩形亦在兩平行線內故是甲丁與丁乙兩線之比例甲戊與戊丙兩線之比例皆若甲戊丁與丁戊乙也或與丁戊丙也丁戊乙與丁戊丙等則甲丁與丁乙亦若甲戊與戊丙也五卷十一後解曰甲乙丙角形內有丁戊線分甲乙甲丙于丁于戊以為比例而等題言丁戊與乙丙為平行線論曰試作丁丙戊乙兩線其甲丁與丁乙兩底之比例若甲戊丁與丁戊乙兩角形也在兩平行線內故見本篇一而甲丁與丁乙之比例若甲戊與戊丙即甲戊丁與丁戊乙之比例亦若甲戊與戊丙也五卷十一又甲戊與戊丙兩底之比例既若甲戊丁與丁戊丙在兩平行線內故見本篇一則甲戊丁與丁戊乙之比例亦若甲戊丁與丁戊丙也五卷十一而丁戊乙與丁戊丙兩角形等矣五卷九兩角形同以丁戊為底而等則在兩平行線內一卷卅九第三題二支三角形任以直線分一角為兩平分而分對角邉為兩分則兩分之比例若餘兩邉之比例三角形分角之線所分對角邉之比例若餘兩邉則所分角為兩平分先解曰甲乙丙角形以甲丁線分乙甲丙角為兩平分題言乙丁與丁丙之比例若乙甲與甲丙論曰試作乙戊線與甲丁平行次于丙甲線引長之至戊其甲乙戊與乙甲丁為平行線相對之兩內角等外角丁甲丙與內角戊亦等外角丁甲丙與內角戊亦等一卷草九今乙甲丁與丁甲丙又等即甲乙戊角與戊角亦等也而甲戊與甲乙兩腰亦等矣一卷六則戊甲與甲丙之比例若乙甲與甲丙也五卷七夫戊甲與甲丙之比例若乙丁與丁丙也本篇二則乙甲與甲丙之比例亦若乙丁與丁丙也五卷十一後解曰乙丁與丁丙之比例若乙甲與甲丙題言甲丁線分乙甲丙角為兩平分論曰依前作乙戊線與甲丁平行而引丙甲線至戊其乙甲與甲丙之比例既若乙丁與丁丙甲丁線又與戊乙邉平行而乙丁與丁丙之比例若戊甲與甲丙本篇二即乙甲與甲丙之比例亦若戊甲與甲丙五卷十一是戊甲與乙甲兩線等矣五卷九則甲乙戊角與戊角亦等也一卷五夫甲乙戊與乙甲丁為平行線相對之兩內角等而外角丁甲丙與內角戊亦等一卷草九則乙甲丁丁甲丙兩角必等第四題凡等角三角形其在等角旁之各兩腰線相與為比例必等而對等角之邉為相似之邉解曰甲乙丙丁丙戊兩角形等角者甲乙丙與丁丙戊甲丙乙與丁戊丙乙甲丙與丙丁戊每相當之各角俱等也題言甲乙與乙丙之比例若丁丙與丙戊甲乙與甲丙若丁丙與丁戊甲丙與乙丙若丁戊與丙戊而每對等角之邉各相似相似者謂各前各後率各對本形之相當等角論曰試並置兩角形令乙丙丙戊兩底為一直線而丁丙戊為甲乙丙之外角其甲乙丙甲丙乙兩角既小于兩直角一卷草七丁戊丙與甲丙乙兩角又等即乙戊兩角亦小於兩直角而乙甲戊丁兩線引出之必相遇一卷界説十一即作兩線令遇于己其丁丙戊外角與甲乙丙內角既等即丁丙與己乙為平行線一卷草八依顯甲丙乙外角與丁戊丙內角既等即甲丙與己戊亦平行線一卷草八而甲己丁丙為平行線方行則甲己與丁丙兩線等也甲丙與己丁兩線等也一卷卅四夫乙戊己角形內之甲丙線既與己戊邉平行即甲乙與等甲己之丁丙之比例若乙丙與丙戊也本篇二更之即甲乙與乙丙若丁丙與丙戊也五卷十六又乙戊己角形內之丁丙線既與己乙邉平行即乙丙與丙戊之比例若等己丁之甲丙與丁戊也本篇二更之即乙丙與甲丙若丙戊與丁戊也五卷十六甲乙與乙丙既若丁丙與丙戊而乙丙與甲丙又若丙戊與丁戊平之即甲乙與甲丙若丁丙與丁戊也五卷草二一系凡角形內之直線與一邉平行而截一分為角形必與全形相似如上甲乙丙角形作丁戊直線與乙丙平行而截一分為甲丁戊角形必與甲乙丙全形相似何者甲丁戊外角與甲乙丙內角等甲戊丁外角亦與甲丙乙內角等一卷草九甲角又同即兩形相似而各等角旁兩邉之比例等本題增題凡角形之內向對角作直線則所分兩平行線比例等論曰第五題兩三角形其各兩邊之比例等即兩形為等角形而對各相似邊之角各等解曰甲乙丙丁戊己兩角形其各兩邊之比例等者甲乙與乙丙若丁戊與戊己而乙丙與甲丙若戊己與丁己甲丙與甲乙若丁己與丁戊也題言此兩形為等角形而對各相似邊之角甲與丁乙與戊丙與己各等論曰試作己戊庚角與乙角等作庚己戊角與丙角等而戊庚己庚兩線遇于庚即庚角與甲角等一卷三二是甲乙丙庚戊己兩形等角矣則甲乙與乙丙之比例若庚戊與戊己也本篇四甲乙與乙丙元若丁戊與戊己則庚戊與戊己亦若丁戊與戊己也而丁戊與庚戊兩線必等五卷九又乙丙與甲丙之比例若戊己與庚己本篇四而乙丙與甲丙元若戊己與丁己則戊己與庚己亦若戊己與丁己也五卷十一而丁己與庚己兩線必等五卷九夫庚戊庚己兩腰既與丁戊丁己兩腰各等戊己同底即丁角與庚角亦等一卷八其餘庚戊己與丁戊己庚己戊與丁己戊各相當之角俱等一卷四而庚角與甲角既等即丁角與甲角亦等丁戊己角與乙角丁己戊角與丙角俱等第六題兩三角形之一角等而等角旁之各兩邊比例等即兩形為等角形而對各相似邊之角各等解曰甲乙丙丁戊己兩角形其乙與戊兩角等而甲乙與乙丙之比例若丁戊與戊己題言餘角丙與己甲與丁俱等論曰試作己戊庚角與乙角等作庚己戊角與丙角等而戊庚己庚兩線遇于庚依前論推顯甲乙丙庚戊己兩形等角即甲乙與乙丙之比例若庚戊與戊己也本篇四甲乙與乙丙元若丁戊與戊己則庚戊與戊己亦若丁戊與戊己也五卷十一而丁戊與庚戊兩線必等五卷九夫丁戊庚戊兩邊既等戊己同邊庚戊己角與丁戊己角又等丁戊己角與乙角等而己戊庚亦與乙等故即其餘各相當之角俱等一卷四而庚角既與甲角等庚己戊角既與丙角等即甲角丙角與丁角戊己丁角各等而甲乙丙丁戊己為等角形矣第七題兩三角形之第一角等而第二相當角各兩旁之邊比例等其第三相當角或俱小于直角或俱不小于直角即兩形為等角形而對各相似邊之角各等解曰甲乙丙丁戊己兩角形其一甲角與一丁角等而第二相當角如甲丙乙兩旁之甲丙丙乙兩邉偕丁己戊兩旁之丁己己戊兩邉比例等其第三相當角如乙與戊或俱小于直角或俱不小于直角題言兩形等角者謂甲丙乙角與己等乙角與戊等先論乙與戊俱小于直角者曰如云不然而甲丙乙大于己令作甲丙庚角與己等即甲庚丙角宜與戊等一卷卅二甲庚丙與丁戊己為等角形矣即甲丙與丙庚之比例宜若丁己與己戊本篇四而先設甲丙與丙乙若丁己與己戊也是甲丙與丙庚亦若甲丙與丙乙也五卷十一是庚丙與乙丙兩線等也五卷九丙庚乙與丙乙庚兩角亦等也一卷五夫乙既小于直角即等腰內之丙庚乙亦小于直角則較角之丙庚甲必大于直角也丙庚甲丙庚乙兩角等于兩直角見一卷十三而丙庚甲既與戊等則丙庚乙宜大于直角矣其相等之乙角何由得小于直角也後論乙與戊俱不小于直角者曰如云不然依先論乙角與丙庚乙角等即丙庚乙亦不小于直角夫丙庚乙丙乙庚同為角形內之兩角乃俱不小于直角一卷十七何也則甲丙乙不得不等于丁己戊也而其餘乙與戊角等矣一卷卅二第八題直角三邉形從直角向對邉作一垂線分本形為兩直角三邉形即兩形皆與全形相似亦自相似解曰甲乙丙直角三邉形從乙甲丙直角作甲丁垂線題言所分甲丁丙甲丁乙兩三邉形皆與全形相似亦自相似論曰甲乙丙甲丁丙兩形既各以乙甲丙甲丁丙為直角而丙角又同即其餘甲乙丙丁甲丙兩角必等一卷三二則甲乙丙甲丁丙兩形必為等角形而等角旁之各兩邉比例必等等者謂乙丙與甲丙若甲丙與丙丁也甲丙與甲乙若丙丁與甲丁也乙丙與甲乙若甲丙與甲丁也即甲丁丙角形與甲乙丙全形相似矣本篇四依顯甲丁乙角形與甲乙丙全形亦相似也何者丙甲乙甲丁乙兩皆直角而乙角又同即其餘甲丙乙丁甲乙兩角必等一卷卅二甲乙丙甲丁乙兩形必為等角形而等角旁之各兩邉比例必等故也依顯甲丁乙甲丁丙兩角形亦相似也何者兩形各與全形相似即兩形自相似五卷十一系從直角作垂線即此線為兩分對邉線比例之中率而直角旁兩邉各為對角全邉與同方分邉比例之中率何者丙丁與丁甲之比例若丁甲與丁乙也故丁甲為丙丁丁乙兩分邉比例之中率也又乙丙與丙甲之比例若丙甲與丙丁也故丙甲為乙丙丙丁之中率也乙丙與乙甲之比例若乙甲與乙丁也故乙甲為乙丙乙丁之中率也第九題一直線求截所取之分法曰甲乙直線求截取三分之一先從甲任作一甲丙線為丙甲乙角次從甲向丙任作所命分之平度如甲丁丁戊戊己為三分也次作己乙直線末作丁庚線與己乙平行即甲庚為甲乙三分之一論曰甲乙己角形內之丁庚線既與乙己邉平行即己丁與丁甲之比例若乙庚與庚甲也本篇二合之己甲與甲丁若乙甲與庚甲也五卷十八而甲丁既為己甲三分之一即庚甲亦為乙甲三分之一也注曰甲乙線欲截取十一分之四先作甲丙線為丙甲乙角從甲向丙任平分十一分至丁次作丁乙線末從甲取四分得戊作戊己線與丁乙平行即甲己為十一分甲乙之四何者依上論丁甲與戊甲之比例若乙甲與己甲也反之甲戊與甲丁若甲己與甲乙也五卷四甲戊為甲丁十一分之四則甲己亦甲乙十一分之四矣依此可推不盡分之數蓋四不為十一之盡分故第十題一直線求截各分如所設之截分法曰甲乙線求截各分如所設甲丙任分之丁戊者謂甲乙所分各分之比例若甲丁丁戊戊丙也先以甲乙甲丙兩線相聮于甲任作丙甲乙角次作丙乙線相聮末從丁從戊作丁己戊庚兩線皆與丙乙平行即分甲乙線于己于庚若甲丙之分于丁于戊論曰甲丁與丁戊之比例既若甲己與己庚本篇二即甲己與己庚亦若甲丁與丁戊也更作丁辛線與甲乙平行而分戊庚于壬即丁戊與戊丙若丁壬與壬辛也亦若等丁壬之己庚一卷卅四與等壬辛之庚乙也本篇二則己庚與庚乙亦若丁戊與戊丙也從此題作一用法平分一直線為若干分如甲乙線求五平分即從甲任作甲丙線為丙甲乙角次從甲向丙任作五平分為甲丁丁戊戊己己庚庚辛次作辛乙直線相聨末作丁壬戊癸己子庚丑四線皆與辛乙平行即壬癸子丑分甲乙為五平分其理依前論推顯又一簡法如甲乙線求五平分即從丙任作丙乙線為丙乙甲角次于乙丙任取一點為丁作丁戊線與甲乙平行次從丁向戊任作五平分為丁己己庚庚辛辛壬壬癸而丁癸線令小于甲乙次從甲過癸作甲子線遇乙丙于子末從子作子壬子辛子庚子己四線各引長之而分甲乙于丑于寅論曰丁戊與甲乙既平行即子壬癸與子丑甲兩角增題有直線求兩分之而兩分之比例若所設兩線之比例第十一題兩直線求别作一線相與為連比例法曰甲乙甲丙兩線求别作一線相與為連比例者合兩線任作甲角而甲乙與甲丙之比例若甲丙與他線也先于甲乙引長之為乙丁與甲丙等次作丙乙線相聨次從丁作丁戊線與丙乙平行末于甲丙引長之遇于戊即丙戊為所求線如以甲丙為前率倣此論曰甲丁戊角形內之丙乙線既與戊丁邉平行即甲乙與乙丁之比例若甲丙與丙戊也本篇二而乙丁甲丙元等即甲乙與甲丙若甲丙與丙戊也五卷七注曰别有一法以甲乙乙丙兩線列作甲乙丙直角次以甲丙線聨之而甲乙引長之末從丙作丙丁即乙丁為所求線第十二題三直線求别作一線相與為斷比例法曰甲乙乙丙甲丁三直線求别作一線相與為斷比例者謂甲丁與他線之比例若甲乙與乙丙也先以甲乙乙丙作直線為甲丙次以甲丁線合甲丙任作甲角次作丁乙線相聨次從丙作丙戊線與丁乙平行末自甲丁引之遇丙戊于戊即丁戊為所求線論曰甲丙戊角形內之丁乙線既與丙戊邊平行即甲丁與丁戊之比例若甲乙與乙丙本篇二第十三題兩直線求别作一線為連比例之中率法曰甲乙乙丙兩直線求别作一線為中率者謂甲乙與他線之比例若他線與乙丙也先以兩線作一直線為甲丙次以甲丙兩平分于戊次以戊為心甲丙為界作甲丁丙半圜末從乙至圜界作乙丁垂線即乙丁為甲乙乙丙之中率論曰試從丁作丁甲丁丙兩線即甲丁丙為直角三卷卅一而直角所下乙丁垂線兩分對邉線甲丙其甲乙與乙丁若乙丁與乙丙也本篇八之系則乙丁為甲乙乙丙之中率注曰依此題可推凡半圜內之垂線皆為分徑線之中率線如甲乙丙半圜其乙丁為甲丁丁丙之中率己戊為甲戊戊丙之中率辛庚為甲庚庚丙之中率也何者半圜之內從垂線作角皆為直角三卷卅一故依前論推顯各為中率也增題一直線而以元線為中率第十四題二支兩平行方形等一角又等即等角旁之兩邉為互相視之邉兩平行方形之一角等而等角旁兩邉為互相視之邉即兩形等先解曰甲乙丙辛乙戊己庚兩平行方形等甲乙丙戊乙庚兩角又等題言此兩角各兩旁之兩邉為互相視之邉者甲乙與乙庚之比例若戊乙與乙丙也論曰試以兩等角相聨于乙令甲乙乙庚為一直線其甲乙丙與戊乙庚既等角即戊乙乙丙亦一直線一卷十五增題次從辛丙己庚各引長之遇于丁其辛乙乙己兩平行方形既等即辛乙與乙丁兩形之比例若乙己與乙丁也五卷七而辛乙與乙丁俱在兩平行線之內等髙即辛乙與乙丁兩形之比例若其底甲乙與乙庚也本篇一依顯乙己與乙丁兩形亦若其底戊乙與乙丙也則甲乙與乙庚亦若戊乙與乙丙也後解曰甲乙丙戊乙庚等角兩旁之各兩邉為互相視之邉者甲乙與乙庚若戊乙與乙丙也題言辛乙乙己兩平行方形等論曰依上論以兩等角相聨其甲乙與乙庚之比例既若戊乙與乙丙而甲乙與乙庚兩底之比例若平行等髙之辛乙與乙丁兩形本篇一戊乙與乙丙兩底之比例若平行等髙之乙己與乙丁兩形則辛乙與乙丁若乙己與乙丁矣而辛乙乙己兩形安得不等五卷九第十五題二支相等兩三角形之一角等即等角旁之各兩邉互相視兩三角形之一角等而等角旁之各兩邉互相視即兩三角形等先解曰甲乙丙乙丁戊兩角形等兩乙角又等題言等角旁之各兩邉互相視者謂甲乙與乙戊之比例若丁乙與乙丙也論曰試以兩等角相聨于乙令甲乙乙戊為一直線其甲乙丙丁乙戊既等角即丁乙乙丙亦一直線一卷十五增題次作丙戊線相聨其甲乙丙乙丁戊兩角形既等即甲乙丙與乙丙戊之比例若乙丁戊與乙丙戊也五卷七夫甲乙丙與乙丙戊兩等髙形之比例若其底甲乙與乙戊也而乙丁戊與乙丙戊兩等髙形亦若其底丁乙與乙丙也則甲乙與乙戊若丁乙與乙丙後解曰兩乙角等而乙旁各兩邊甲乙與乙戊之比例若丁乙與乙丙題言甲乙丙乙丁戊兩角形等論曰依前列兩形令等角旁兩邉各為一直線其甲乙與乙戊之比例既若丁乙與乙丙而甲乙與乙戊兩底又若其上甲乙丙乙丙戊兩等髙角形丁乙與乙丙兩底又若其上乙丁戊乙丙戊兩等髙角形則甲乙丙與乙丙戊之比例若乙丁戊與乙丙戊矣而甲乙丙與乙丁戊豈不相等五卷九第十六題二支四直線為斷比例即首尾兩線矩內直角形與中兩線矩內直角形等首尾兩線與中兩線兩矩內直角形等即四線為斷比例先解曰甲乙己庚戊己乙丙四直線為斷比例者謂甲乙與己庚若戊己與乙丙也而甲乙丙丁為甲乙乙丙首尾兩線矩內直角形戊己庚辛為戊己己庚中兩線矩內直角形題言甲丙戊庚兩形等論曰兩形之乙與己既等為直角而甲乙與己庚之比例若戊己與乙丙是乙己等角旁之各兩邉互相視而甲丙戊庚兩直角形必等本篇十四後解曰甲丙戊庚兩直角形等題言四線之比例等者謂甲乙與己庚若戊己與乙丙也論曰甲丙戊庚兩形之乙與己既等為直角即等角旁之各兩邉互相視而甲乙與己庚之比例若戊己與乙丙也本篇十四則四線為斷比例矣注曰若平行斜方形而等角亦同此論如上圗以上二題第十七題二支三直線為連比例即首尾兩線矩內直角形與中線上直角方形等首尾線矩內直角形與中線上直角方形等即三線為連比例先解曰甲乙戊己乙丙三線為連比例者甲乙與戊己若戊己與乙丙也而甲乙丙丁為甲乙乙丙首尾線矩內直角形戊己庚辛為戊己上直角方形題言甲丙戊庚兩形等論曰試作己庚線與戊己等即甲乙乙丙己庚戊己為比例等等者謂甲乙與戊己若己庚與乙丙也則戊己己庚矩內直角形即戊己上直角方形與甲乙乙丙首尾線矩內之甲丙形等矣本篇十六後解曰甲丙直角形與戊庚直角方形等題言甲乙與戊己之比例若戊己與乙丙論曰甲丙戊庚既皆直角形即甲乙與戊己之比例若己庚與乙丙也本篇十六而己庚與乙丙亦若等己庚之戊己與乙丙五卷七則甲乙與戊己若戊己與乙丙矣注曰若平行斜方形而等角亦同此論如上圗系凡直線上直角方形與他兩線所作矩內直角形等即此線為他兩線之中率何者依上後論甲乙乙丙矩內直角形與戊己上直角方形等即可推甲乙與戊己若戊己與乙丙而戊己為甲乙乙丙之中率故第十八題直線上求作直線形與所設直線形相似而體勢等法曰如甲乙線上求作直線形與所設丙丁戊己庚形相似而體勢等先于設形任從一角向各對角各作直線而分本形為若干角形如上設形則從己向丙向丁作兩直線而分為丙丁己丁己戊丙己庚三三角形也次于元線上作乙甲壬甲乙壬兩角與丁丙己丙丁己兩角各等其甲壬乙壬兩線遇于壬即甲壬乙與丙己丁兩角亦等而甲壬乙與丙己丁兩形為等角形矣一卷卅二次作乙壬辛壬乙辛兩角與丁己戊己丁戊兩角各等其壬辛乙辛兩線遇于辛即乙辛壬與丁戊己兩角亦等而乙壬辛與丁己戊兩形為等角形矣末依上作甲壬癸與丙己庚亦為等角形即甲乙辛壬癸與丙丁戊己庚兩形等角則相似而體勢等凡設多角形俱倣此論曰壬甲乙角與己丙丁角既等而壬甲癸角與己丙庚角又等即乙甲癸全角與丁丙庚全角等依顯甲乙辛與丙丁戊兩全角亦等而其餘各全角俱等則甲乙辛壬癸與丙丁戊己庚為等角形矣又甲乙與乙壬之比例既若丙丁與丁己而乙壬與乙辛亦若丁己與丁戊本篇四平之即甲乙與乙辛亦若丙丁與丁戊也五卷草二則甲乙辛丙丁戊兩等角旁各兩邊之比例等也而辛戊兩等角旁各兩邊之比例亦等也兩形等角即等角旁各兩邊之比例等見本篇四又辛壬與壬乙之比例既若戊己與己丁而壬乙與壬甲亦若己丁與己丙壬甲與壬癸亦若己丙與己庚平之即辛壬與壬癸亦若戊己與巳庚也五卷草二則辛壬癸戊己庚兩等角旁各兩邊之比例等也依顯餘角俱如是則兩形為等角形而各等角旁各兩邊之比例俱等是兩形相似而體勢等注曰凡線上形相當之各角等即形相似而體勢等如上甲乙丙丁戊己兩角形其乙丙戊己線上之乙角丙角與戊角己角相當相等者是也若兩形在乙丙丁戊兩線上則雖相似而體勢不等又如上甲丙戊庚兩直角形其甲丁與丁丙之比例若戊辛與辛庚而餘邉之比例俱等亦形相似而體勢等若甲丙壬庚兩直角形雖角旁比例等而在丁丙庚辛線上不相當則體勢不等增作本題别有一簡法如設甲乙丙丁戊己直線形求于庚線上作直線形與相似而體勢等兩線任引出之為甲辛甲丑次從甲向各角各任作直線第十九題相似三角形之比例為其相似邉再加之比例解曰如甲乙丙丁戊己兩角形等角其乙與戊丙與己相當之角各等而甲乙與乙丙之比例若丁戊與戊己題言兩形之比例為乙丙與戊己兩邉再加之比例先論曰若兩角形等即乙丙與戊己兩邉亦等而各兩等邉為相同之比例即兩形亦相同之比例就令作再加之比例亦未免為相同之比例則相等之兩形即可為兩等邉再加之比例矣後論曰若乙丙邉大于戊己邉即于乙丙線上截取乙庚為連比例之第三率令乙丙與戊己之比例若戊己與乙庚也本篇十一次作甲庚直線其甲乙與乙丙之比例若丁戊與戊己更之即甲乙與丁戊若乙丙與戊己也而乙丙與戊己若戊己與乙庚則甲乙與丁戊若戊己與乙庚也夫甲乙庚與丁戊己兩角形有乙戊兩等角而各兩旁之兩邉又互相視本篇十五即兩形等則甲乙丙形與丁戊己形之比例若甲乙丙形與甲乙庚形矣五卷七又甲乙丙與甲乙庚兩等髙角形之比例若乙丙底與乙庚底本篇一則甲乙丙形與丁戊己形之比例亦若乙丙底與乙庚底也既乙丙戊己乙庚三線為連比例則一乙丙與三乙庚之比例為一乙丙與二戊己再加之比例矣是甲乙丙與丁戊己兩形之比例為乙丙與戊己再加之比例也系依本題可顯凡三直線為連比例即第一線上角形與第二線上角形之比例若第一線與第三線之比例如上甲乙丙三直線為連比例其甲與乙上各有角形相似而體勢等則一甲線與三丙線之比例若甲形與乙形也何者甲線與丙線之比例為甲線與乙線再加之比例而甲形與乙形之比例亦甲線與乙線再加之比例則甲形與乙形之比例若甲線與丙線矣依顯二乙上角形與三丙上角形相似而體勢等則二乙形與三丙形之比例若相似而體勢等則二乙形與三丙形之比例若一甲線與三丙線第二十題三支以三角形分相似之多邉直線形則分數必等而相當之各三角形各相似其各相當兩三角形之比例若兩元形之比例其元形之比例為兩相似邉再加之比例先解曰此甲乙丙丁戊彼己庚辛壬癸兩多邉直線形其乙甲戊庚己癸兩角等餘相當之各角俱等而各等角旁各兩邉之比例各等題先言各以角形分之其角形之分數必等而相當之各角形各相似論曰試從乙甲戊庚己癸兩角向各對角俱作直線為甲丙甲丁己辛己壬其元形既相似即角數等而所分角形之數亦等又乙角既與庚角等而角旁各兩邉之比例亦等即甲乙丙與己庚辛兩角形必相似本篇六乙甲丙與庚己辛兩角甲丙乙與己辛庚兩角各等而各等角旁各兩邉之比例各等本篇四依顯甲戊丁己癸壬兩角形亦相似又甲丙與丙乙之比例既若己辛與辛庚而丙乙與丙丁若辛庚與辛壬兩元形相似故平之即甲丙與丙丁若己辛與辛壬也五卷草二又乙丙丁角既與庚辛壬角等而各減一相等之甲丙乙角己辛庚角即所存甲丙丁角與己辛壬角必等則甲丙丁與己辛壬兩角形亦等角形亦相似矣本篇六次解曰題又言各相當角形之比例若兩元形之比例論曰甲乙丙己庚辛兩角形既相似即兩形之比例為甲丙己辛兩相似邉再加之比例本篇十九依顯甲丙丁己辛壬之比例亦為甲丙己辛再加之比例則甲乙丙與己庚辛兩角形之比例若甲丙丁與己辛壬兩角形之比例依顯甲丁戊與己壬癸之比例亦若甲丙丁與己辛壬之比例則此形中諸角形之比例若彼形中諸角形之比例此諸形為前率彼諸形為後率而一前與一後之比例又若并前與并後之比例五卷十二即此一角形與相當彼一角形之比例若此元形與彼元形之比例矣後解曰題又言兩多邉元形之比例為兩相似邉再加之比例論曰甲乙丙與己庚辛兩角形之比例既若甲乙丙丁戊與己庚辛壬癸兩多邉形之比例而甲乙丙與己庚辛兩形之比例為甲乙己庚兩相似邉再加之比例本篇十九則兩元形亦為甲乙己庚再加之比例增題此直線為四倍大之比例若此方形與彼方形後解曰題言甲邉與乙邉為二倍大之比例系依此題可顯三直線為連比例如甲乙丙則第一線上多邉形與第二線上相似多邉形之比例若第一線與第三線之比例第二十一題兩直線形各與他直線形相似則自相似解曰甲乙丙丁戊己兩直線形各與庚辛壬形相似題言兩形亦自相似論曰甲乙丙形之各角既與庚辛壬形之各角等而丁戊己形之各角亦與庚辛壬形之各角等即兩形之各角自相等公論兩形之各角既等則甲乙丙形與庚辛壬形各等角旁各邉之比例等五卷十一而丁戊己形與庚壬辛形各等角旁各邉之比例亦等也是甲乙丙形與丁戊己形各等角旁各邉之比例亦等也各角既等各邉之比例又等即兩形定相似矣本卷界説一第二十二題二支四直線為斷比例則兩比例線上各任作自相似之直線形亦為斷比例兩比例線上各任作自相似之直線形為斷比例則四直線為斷比例先解曰甲乙丙丁戊己庚辛四直線為斷比例者甲乙與丙丁若戊己與庚辛也今于甲乙丙丁上各任作直線形自相似如甲乙壬丙丁癸于戊己庚辛上各任作直線形自相似如戊己丑子庚辛卯寅題言四形亦為斷比例者謂甲乙壬與丙丁癸若戊丑與庚卯也論曰試以甲乙丙丁兩線求其連比例之末率線為辰本篇十一次以戊己庚辛兩線求其連比例之末率線為己平之即甲乙與辰之比例若戊己與己也五卷草二夫甲乙壬與丙丁癸兩相似形之比例若甲乙線與辰線本篇十九及草之系而戊丑與庚卯兩相似形之比例若戊己線與己線則甲乙壬與丙丁癸之比例亦若戊丑與庚卯矣五卷十一後解曰如前四形為斷比例題言甲乙丙丁戊己庚辛四線亦為斷比例論曰試以甲乙丙丁戊己三線求其斷比例之末率線為午未本篇十二次于午未上作直線形與戊丑相似而體勢等為午未酉申本篇十八午酉與戊丑相似即與庚卯亦相似而甲乙與丙丁之比例既若戊己與午未依上論即甲乙壬與丙丁癸兩形之比例若戊丑與午酉矣夫甲乙壬與丙丁癸之比例元若戊丑與庚卯則戊丑與午酉亦若戊丑與庚卯也五卷十一而午酉與庚卯等也五卷九午酉與庚卯既等又相似而體勢等即兩形必在等線之上而庚辛與午未必等見下方補論則戊己與午未之比例若戊己與庚辛也而戊己與午未元若甲乙與丙丁則甲乙與丙丁亦若戊己與庚辛也補論曰庚卯午酉兩直線形相等相似而體勢等即在等線之上者何也蓋庚辛與午未若云不等者或言庚辛大于午未也則辛卯宜亦大于未酉矣五卷十四而庚卯形宜亦大于午酉形矣何先設兩形等也言小倣此補論者前此未著而論中無他論可徴故别作一論以足未備又補論曰甲乙丙丁戊己兩直線形相等相似而體勢等即相似邉如甲乙與丁戊必等者何也蓋云不等者或言甲乙大于丁戊也即令以甲乙丁戊兩線求其連比例之末率線為庚本篇十一其甲乙與丁戊既若丁戊與庚而甲乙大于丁戊即丁戊宜大于庚即甲乙宜更大于庚矣然甲乙與庚之比例若甲乙丙形與丁戊己形本篇十九及草之系甲乙既大于庚則甲乙丙宜大于丁戊己何先設兩形等也是甲乙不能大于丁戊矣言小倣此增論曰本題别有簡論今先顯四線之比例等而甲今先顯四線之比例等而甲乙壬與丙丁癸兩形之比例若戊丑與庚卯兩形者蓋甲乙與丙丁之比例若戊己與庚辛而甲乙壬與丙丁癸之比例為甲乙與丙丁再加之比例本篇十九戊丑與庚卯之比例亦為戊己與庚辛再加之比例是甲乙壬與丙丁癸若戊丑與庚卯也第二十三題等角兩平行方形之比例以兩形之各兩邊兩比例相結解曰甲丙丙己兩平行方形之乙丙丁戊丙庚兩角等題言兩形之比例以各等角旁各兩邉之比例相結者謂兩比例之前率在此形兩比例之後率在彼形如甲丙與丙己之比例以乙丙與丙庚偕丁丙與丙戊相結也或以乙丙與丙戊偕丁丙與丙庚相結也論曰試以兩等角相聨于丙而乙丙丙庚作一直線其乙丙丁角既與戊丙庚角等即戊丙丙丁亦一直線一卷十五增次于甲丁己庚各引長之遇于辛次任作一壬線次以乙丙丙庚壬三線求其斷比例之末率線為癸本篇十二末以丁丙丙戊癸三線求其斷比例之末率線為子其乙丙與丙庚兩底之比例既若甲丙與丙辛兩形本篇一而乙丙與丙庚亦若壬與癸則甲丙與丙辛亦若壬與癸也五卷十一依顯丙辛與丙己亦若癸與子也平之即甲丙與丙己若壬與子也五卷草二夫壬與子之比例元以壬與癸癸與子兩比例相結本卷界説五而壬與癸癸與子元若乙丙與丙庚丁丙與丙戊則甲丙與丙己之比例以乙丙與丙庚偕丁丙與丙戊兩比例相結也其以乙丙與丙戊偕丁丙與丙庚相結則先以乙丙丙戊為一直線可依上推顯後注曰不相等之形也等角旁各兩邉不互相視本篇十四故第二十四題平行線方形之兩角線方形自相似亦與全形相似解曰甲乙丙丁平行方形作甲丙對角線任作戊己庚辛兩線與丁丙乙丙平行而與對角線交相遇于壬題言戊庚己辛兩角線方形自相似亦與全形相似論曰試依一卷草九題推顯兩角線形等角又庚甲戊與乙甲丁同角而甲戊壬外角與甲丁丙內角等甲庚壬外角與甲乙丙內角等戊壬庚外角與乙己壬內角等乙己壬外角又與乙丙丁內角等則戊庚形與甲丙全形等角矣依顯己辛形亦與全形等角矣今欲顯兩形與全形相似者試觀甲庚壬與甲乙丙兩角形甲戊壬與甲丁丙兩角形既各等角一卷草九可推仍見本篇四之系即甲乙與乙丙之比例若甲庚與庚壬而庚乙兩角旁各兩邊之比例等也六卷四又乙丙與丙甲之比例若庚壬與壬甲丙甲與丙丁之比例若壬甲與壬戊平之即乙丙與丙丁若庚壬與壬戊也五卷草二則乙丙丁庚壬戊兩角旁各兩邊之比例等也依顯各角旁各兩邊之比例皆等是兩角線方形自相似亦與全形相似第二十五題兩直線形求作他直線形與一形相似與一形相等法曰甲乙兩直線形求作他直線形與甲相似與乙相等先于求相似之甲形任取一邊如丙丁于丙丁邊上作平行方形與甲等為丙戊一卷四四四五次于丁戊邊上作平行方形與乙等而戊丁庚角與丁丙己角等為丁辛其丙丁庚己戊辛俱為直線也一卷四五可推次作一壬癸線為丙丁丁庚之中率本篇十三末于壬癸上作子形與甲相似而體勢等本篇十八即子形與乙等論曰丙丁壬癸丁庚三線既為連比例即依本篇二十題之系可顯一丙丁與三丁庚之比例若一丙丁上之甲與二壬癸上之子兩形相似而體勢等者之比例也又丙丁與丁庚之比例若丙戊與丁辛兩等髙平行方形之比例也本篇一則丙戊與丁辛若甲與子矣夫丙戊與丁辛元若甲與乙也丙戊與甲等丁辛與乙等則甲與乙之比例若甲與子也五卷十一而乙形與子形等矣五卷九第二十六題平行方形之內減一平行方形其減形與元形相似而體勢等又一角同則減形必依元形之對角線解曰乙丁平行方形之內減戊庚平行方形元形減形相似而體勢等又戊甲庚同角題言戊庚形必依乙丁形之對角線論曰試作甲己己丙對角兩線若兩線為一直線即顯戊庚形依甲丙對角線矣如云甲己己丙非一直線令别作元形之對角線而分戊己邉于辛即作辛壬線與己庚平行其乙丁戊壬兩平行方形既同依甲辛丙一直對角線則宜相似而體勢等矣本篇草四是乙甲與甲丁之比例宜若戊甲與甲壬也夫乙甲與甲丁元若戊甲與甲庚元設形相似而體勢等今若所云則戊甲與甲庚亦若戊甲與甲壬矣五卷十一而甲壬分與甲庚全亦等矣五卷九可乎若云甲辛丙分己庚于辛即令作辛壬與己戊平行依前論駁之第二十七題凡依直線之有闕平行方形不滿線者其闕形與半線上之闕形相似而體勢等則半線上似闕形之有闕依形必大于此有闕依形解曰甲乙線平分于丙于半線丙乙上任作丙丁戊乙平行方形其對角線乙丁次作甲乙戊辛滿元線平行方形即甲丁為甲丙半線上之有闕依形丙戊為丙乙半線上之闕形本卷界説六此兩形相等相似勢體又等題言甲乙線上凡作有闕依形不滿線者其闕形與丙戊相似而體勢等即甲丙半線上之甲丁有闕依形必大于此有闕依形論曰試于乙丁對角線上任取一點為庚從庚作己庚壬線庚癸線與甲乙乙戊各平行即得甲庚為依甲乙元線之有闕平行方形而癸壬為其闕形此癸壬闕形既依乙丁對角線則與丙戊闕形相似而體勢等本篇草四夫丙庚庚戊兩餘方形既等一卷四三若每加一癸壬角線方形即丙壬與癸戊亦等也又丙壬與丙己俱在兩平行線內底等即兩形等一卷三六而丙己與癸戊兩形亦等若每加一丙庚形是甲庚平行方形與子丑磬折形亦等也丙戊平行方形函子丑磬折形之外尚有庚丁形則丙戊形必大于子丑磬折形而等丙戊之甲丁形丙戊甲丁同在兩平行線內又等底故見一卷三六必大于等磬折形之甲庚形矣依顯凡依乙丁對角線作形與丙戊相形者其有闕依形俱小于甲丁也為其必有庚丁之較故也又論甲丁必大于甲庚曰己丁丁壬兩平行方形同在兩平行線內又底等即兩形等一卷卅六而庚戊為丁壬之分則丁壬大于庚戊較餘一庚丁形其大于丙庚亦如之庚戊丙庚兩餘方形等故見一卷四三即等丁壬之己丁形其大于丙庚亦較餘一庚丁形也次每加一丙己形則甲丁必大于甲庚矣又解曰若庚點在丙戊形外即引乙丁對角線至庚從庚作辛丑線與癸戊平行次引甲癸線至辛引乙戊線至丑而與辛丑線遇于辛于丑末作庚己線與辛甲平行即得甲庚為依甲乙元線之有闕平行方形又得己丑與丙戊相似而體勢等者兩形同依乙庚對角線故見本篇草四為其闕形也題言甲丁形亦大于甲庚形論曰試于丙丁線引出之至子即辛子子丑兩線等一卷卅四而辛丁丁丑兩形亦等一卷卅六其丁丑己丁兩餘方形既等即己丁與辛丁亦等夫辛丁大于辛壬既較餘一庚丁形則己丁之大于辛壬亦較餘一庚丁形也此兩率者每加一甲壬平行方形則甲丁大于甲庚者亦較餘一庚丁形矣依顯凡乙丁對角線引出丙戊形外依而作形與丙戊相似者其有闕依形俱小于甲丁也為其必有庚丁之較故也第二十八題一直線求作依線之有闕平行方形與所設直線形等而其闕形與所設平行方形相似其所設直線形不大于半線上所作平行方形與所設平行方形相似者法曰甲乙線求作依線之有闕平行方形與所設直線形丙等而其闕形與所設平行方形丁相似先以甲乙線兩平分于戊次于戊乙半線上作戊己庚乙平行方形與丁相似而體勢等本篇十八次作甲辛庚乙滿元線平行方形若甲己平行方形與丙等者本篇草五即得所求矣若甲己大于丙者題言甲己小即不可作見本篇草七即等甲己之戊庚亦大于丙也則尋戊庚之大于丙幾何假令其較為壬兩直線形不等相減之較法見一卷四五增即作癸子丑寅平行方形與壬等又與戊庚形相似而體勢也本篇草五則戊庚平行方形與丙直線形及癸丑平行方形并等而戊庚必大于癸丑矣夫戊庚與癸丑既相似即戊己與巳庚兩邊之比例若寅癸與癸子也而戊庚既大于癸丑即戊己己庚兩邉亦大于寅癸癸子也次截取己巳己卯與癸子癸寅等而作己己辰卯平行方形必與癸丑形相等相似而體勢等矣又卯己形既與戊庚相似而體勢等必同依乙己對角線也本篇草六次于己辰線引出抵甲乙元線于卯辰兩界各引出作午未線即甲辰為依甲乙線之有闕平行方形與丙等而其闕形乙辰與戊庚相似本篇草四即亦與丁相似論曰辰庚與辰戊兩餘方形既等一卷四三每加一乙辰角線方形即乙己與戊午亦等而與等戊午之戊未亦等戊午戊未同在平行線內又底等故見一卷卅六乙己與戊未既等又每加一申辰方形即甲辰平行方形與申酉罄折形亦等矣夫申酉罄折形為戊庚形之分而戊庚與丙及癸丑等戊庚所截去之卯己又與癸丑等則申酉罄折形與丙等也而甲辰亦與丙等也第二十九題一直線求作依線之帶餘平行方形與所設直線形等而其餘形與所設平行方形相似法曰甲乙線求作依線之帶餘平行方形與所設直線形丙等而其餘形與所設平行方形丁相似先以甲乙線兩平分于戊次于戊乙半線上作戊己庚乙平行方形與丁相似而體勢等本篇十八次别作一平行方形與丙及戊庚并等為辛二卷十四次别作一平行方形與辛等又與丁相似而體勢等為壬癸子丑本篇草五其丑癸既與辛等即大于戊庚而丑癸既與戊庚相似即丑壬與壬癸兩邉之比例若戊己與己庚也而丑壬與壬癸兩線必大於戊巳與巳庚也若等或小即丑癸不大於戊庚次於巳戊引之至卯與壬丑等於巳庚引之至寅與壬癸等而作卯寅平行方形即卯寅與丑癸同依辰巳對角線而等本篇草六又與戊庚相似而體勢等矣次于甲乙引之至巳庚乙引之至午於午卯引之至未末作甲未線與己卯平行即得甲辰帶餘平行方形依甲乙線與丙等而己午為其餘形與戊庚形相似而體勢等本篇草四即與丁相似而體勢等論曰甲卯戊午兩形既等一卷卅六戊午與乙寅兩餘方形又等一卷四三則甲卯與乙寅亦等矣而每加一卯己形則甲辰平行方形與戊辰寅罄折形亦等矣夫戊辰寅罄折形元與丙等丑癸即卯寅與丙及戊庚并等每減一戊庚即罄折形與丙等即甲辰亦與丙等第三十題一直線求作理分中末線法曰甲乙線求理分中末先于元線作甲乙丙丁直角方形次依丁甲邉作丁己帶餘平行方形與甲丙直角方形等而甲己為其餘形又與甲丙形相似本篇草九即甲己亦直角方形矣惟直角方形恆與直角方形相似則戊己線分甲乙于辛為理分中末線也本卷界説三論曰丁己與甲丙兩形既等每減一甲戊形即所存甲己辛丙兩形亦等矣此兩形之甲辛己戊辛乙兩角既等兩皆直角故即兩角旁之各兩邉線為互相視之線也本篇十四而等戊辛之甲乙線與等辛己之甲辛線其為比例若甲辛與辛乙也是甲辛乙線為理分中末也又論曰甲乙甲辛辛乙凡三線而第一第三矩內之辛丙直角形與第二甲辛上直角方形等即三線為連比例本篇十七而甲乙與甲辛若甲辛與辛乙矣又法曰甲乙線求分于丙而甲乙偕丙乙矩內直角形與甲丙上直角方形等二卷十一即甲乙之分于丙為理分中末線蓋甲乙甲丙丙乙三線為連比例故本篇草七第三十一題三邉直角形之對直角邉上一形與直角旁邉上兩形若相似而體勢等則一形與兩形并等解曰甲乙丙三邉直角形乙甲丙為直角于乙丙上任作直線形為乙丙丁戊次于甲乙甲丙上亦作甲乙己庚甲丙壬辛兩形與乙丁形相似而體勢等本篇十八題言乙丁形與乙庚丙辛兩形并等論曰試從甲作甲癸為乙丙之垂線依本篇第八題之系即乙丙與丙甲兩邉之比例若丙甲與丙癸兩邉則一乙丙邉與三丙癸邉之比例若一乙丙上之乙丁形與二甲丙上之丙辛形也本篇十九或二十之系反之則丙癸與乙丙兩邉之比例若丙辛與乙丁兩形也依顯乙癸與乙丙兩邉之比例若乙庚與乙丁兩形也乙丙乙甲乙癸三邉為連比例故見本篇八之系夫一丙癸與二乙丙之比例既若三丙辛與四乙丁而五乙癸與二乙丙之比例亦若六乙庚與四乙丁則一丙癸五乙癸并與二乙丙之比例若三丙辛六乙庚并與四乙丁也既一丙癸五乙癸并與二乙丙等則三丙辛六乙庚并與四乙丁亦等五卷草四又論曰甲乙丙與癸甲丙兩角形既相似而甲乙丙角形其乙丙與丙甲之比例若癸甲丙角形之丙甲與丙癸本篇八即乙丙與丙甲兩邉相似則癸甲丙與甲乙丙兩角形之比例為丙甲與乙丙再加之比例本篇十九而丙辛與乙丁兩形之比例亦為丙甲與乙丙再加之比例本篇十九二十則癸甲丙與甲乙丙兩角形之比例若丙辛與乙丁兩形也五卷十一依顯癸乙甲與甲乙丙兩角形之比例若乙庚與乙丁兩形也是一甲癸丙與二甲乙丙之比例若三丙辛與四乙丁也而五癸乙甲與二甲乙丙之比例若六乙庚與四乙丁也即一甲癸丙五癸乙甲并與二甲乙丙之比例若三丙辛六乙庚并與四乙丁也五卷草四既一甲癸丙五癸乙甲并與二甲乙丙等則三丙辛六乙庚并與四乙丁亦等又論曰一甲丙上直角方形與二乙丙上直角方形之比例若三丙辛形與四乙丁形此兩率之比例皆甲丙與乙丙再加之比例見本篇十九二十又五甲乙上直角方形與二乙丙上直角方形之比例若六乙庚形與四乙丁形即一甲丙上五甲乙上兩直角方形并與二乙丙上直角方形之比例若三丙辛六乙庚兩形并與四乙丁形五卷草四既甲丙甲乙上兩直角方形并與乙丙上直角方形等一卷四十則丙辛乙庚兩形并與乙丁形等增題角形之一邉上一形其一形與兩形并等則餘兩邉內角必直角第三十二題兩三角形此形之兩邉與彼形之兩邉相似而平置兩形成一外角若各相似之各兩邉各平行則其餘各一邉相聨為一直線解曰甲乙丙丁丙戊兩角形其甲乙甲丙邉與丁丙丁戊邉相似者謂甲乙與甲丙之比例若丁丙與丁戊也試平置兩形令相切成一甲丙丁外角而甲乙與丁丙甲丙與丁戌各相似之兩邉各平行題言乙丙丙戊為一直線論曰甲乙與丁丙既平行即甲角與內相對之甲丙丁等一卷草九依顯丁角亦與內相對之甲丙丁等則甲丁兩角等而甲乙丙與丁丙戊兩角形之甲丁兩角旁各兩邉比例又等即兩形為等角形而乙角與丁丙戊角必等本篇六次于乙角加甲角于丁丙戊角加等甲之甲丙丁角即乙甲兩角并與等甲丙丁丁丙戊兩角并之甲丙戊角等次每加一甲丙乙角即甲乙丙形之內三角并與甲丙乙甲丙戊兩角并等夫甲乙丙形之內三角等兩直角一卷卅二則甲丙乙甲丙戊并亦等兩直角而為一直線一卷十四第三十三題等圜之乘圜分角或在心或在界其各相當兩乘圜角之比例皆若所乘兩圜分之比例而兩分圜形之比例亦若所乘兩圜分之比例解曰甲乙丙戊己庚兩圜等其心為丁為辛兩圜各任割一圜分為乙丙為己庚其乘圜角之在心者為乙丁丙己辛庚在界者為乙甲丙己戊庚題先言乙丙與己庚兩圜分之比例若乙丁丙與己辛庚兩角次言乙甲丙與己戊庚兩角之比例若乙丙與己庚兩圜分後言乙丁丁丙兩腰偕乙丙圜分內乙丁丙分圜形與己辛辛庚兩腰偕己庚圜分內己辛庚分圜形之比例亦若乙丙與己庚兩圜分先論曰試作乙丙己庚兩線次作丙壬合圜線與乙丙等作庚癸癸子兩合圜線各與己庚等四卷一其丙壬既與乙丙等即乙丙與丙壬兩圜分亦等三卷十八而乙丁丙與丙丁壬兩角亦等三卷草七依顯己庚庚癸癸子三圜分己辛庚庚辛癸癸辛子三角俱等則乙丙壬圜分倍乙丙圜分之數如在心乙丁壬角或乙丁壬內地倍乙丁丙角之數而己庚癸子圜分倍己庚圜分之數如在心己辛子角或己辛子內地倍己辛庚角之數何者乙丁壬己辛子兩角或兩地內之分數與乙丙壬己庚癸子兩圜分內之分數各等故也然則乙丁壬角與地若等于己辛子角與地即乙丙壬圜分必等于己庚癸子圜分矣若大亦必等于己庚癸子圜分矣若大亦大若小亦小矣是一乙丙所倍之乙丙壬三乙丁丙所倍之乙丁壬偕二己庚所倍之己庚癸子四己辛庚所倍之己辛子等大小皆同類也則一乙丙與二己庚之比例若三乙丁丙與四己辛庚也五卷界説六次論曰乙丁丙角倍大于乙甲丙角而己辛庚角亦倍大于己戊庚三卷二十即乙丁丙與己辛庚兩角之比例若乙甲丙與己戊庚兩角矣五卷草五則乙甲丙與己戊庚在界乘圜之兩角亦若乙丙與己庚兩圜分也五卷十一若作甲壬戊癸直線亦可用先論推顯用地當角説見三卷草增題後論曰試于乙丙圜分內作乙丑丙角次于丙壬圜分內作丙寅壬角此兩角所乘之乙甲壬丙與丙乙甲壬兩圜分既等三卷草七即兩角亦等而乙丑丙與丙寅壬兩圜小分亦相似亦相等乙丙與丙壬兩合圜線等故見三卷草四次每加一相等之乙丁丙丙丁壬角形即乙丁丙丙丁壬兩分圜形等一卷四則乙丁壬分圜形倍乙丁丙分圜形之數如乙丙壬圜分倍乙丙圜分之數依顯己辛子分圜形倍己辛庚分圜形之數亦如己庚癸子圜分倍己庚圜分之數然則乙丙壬圜分若等于己庚癸子圜分者即乙丁壬分圜形亦等于己辛子分圜形矣若大亦大若小亦小矣五卷界説六是乙丙壬圜分之倍一乙丙圜分乙丁壬分圜形之倍三乙丁丙分圜形偕己庚癸子圜分之倍二己庚圜分己辛子分圜形之倍四己辛庚分圜形等大小皆同類也則一乙丙圜分與二己庚圜分之比例若三乙丁丙分圜形與四己辛庚分圜形也五卷界説六一系在圜心兩角之比例皆若兩分圜形二系在圜心角與四直角之比例若圜心角所乘圜分與全圜界四直角與在圜心角之比例若全圜界與圜心角所乘之圜分按丁先生言竟不及有比例之靣故因其義類增益數題用補闕如左云竇復增一題竊辨于首仍以題旨從先生舊題五卷界説二十增一系全圜與全圜半圜與半圜相當分與相當分二系三邊直角形對直角邊為徑所作圜與餘兩邉為徑三系三線為連比例以為徑所作三圜亦為連比例一增題直線形求減所命分其所減所存各作形二增題兩直線形求别作一直線形為連比例三增題三直線形求别作一直線形為斷比例今附四增題兩直線形求别作一形為連比例之中率五增題一直線形求分作兩直線形俱與所設形相似而體勢等其比例若所設兩幾何之比例其比例先作戊己庚辛直線形與甲等與丁相似而體勢等本篇草五次任用其一邉如戊辛兩分之于壬令戊壬與壬辛之比例若乙與丙也分法先以乙丙兩線聯為一直線次截戊壬與壬辛若乙與丙見本篇十次于戊辛上作戊癸辛半圜次從壬作癸壬為戊辛之垂線次作戊癸六增題一直線形求分作兩直線形俱與所設形相似而體勢等其兩分形兩相似邉之比例若所設兩幾何之比例今附七增題兩直線形求并作一直線形與所設形相似而體勢等八增題圜內兩合線交而相分其所分之線彼此互相視九增題圜外任取一點其兩全線與兩規外線彼此互相視若從點作一切圜線十增題兩直線相遇作角從兩線之各一界互下垂線題言兩圖之甲乙謂甲乙與乙丙若丁乙與乙戊也又甲乙與丁乙十一增題平行線形內兩直線與兩邉平行相交十二增題凡四邉形之對角兩線交而相分其所分四三角形任相與為比例皆等十三增題三角形任于一邉任取一點從點求作一線十四增題一直線形求别作一直線形相似而體勢等用此法亦可依此直線形減作二分之一十五增題諸三角形求作內切直角方形
