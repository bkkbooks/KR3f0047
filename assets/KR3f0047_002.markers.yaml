  - {type: variant, offset: 2542, length: 0, content: '', WYG: 以數明之設十數平分之各五又任増三為十三十三之羃一百六十九及三之羃九倍大于五之羃二十五及八之羃六十四也第十一題一直線求兩分之而元線偕初分線矩内直角形與分餘線上直角方形等法曰甲乙線求兩分之而元線偕初分小線矩内直角形與分餘大線上直角方形等先于甲乙上作甲丙直角方形次以甲丁線兩平分于戊次作戊乙線次從戊甲引増至己而戊己線與戊乙等末于甲乙線截取甲庚與甲己等即甲乙偕庚乙矩線内直角形與甲庚上直角方形等如所求論曰試于庚上作壬辛線與丁己平行次作己辛線與甲庚平行其壬庚與丙乙等即與甲乙等而庚丙直角形在甲乙偕庚乙矩線内也又甲庚與甲己等而甲為直角即己庚為甲庚上直角方形也一卷卅四今欲顯庚丙直角形與己庚直角方形等者試觀甲丁兩平分于戊而引増一甲己是丁己偕甲己矩線内直角形即丁辛直角形及甲戊上直角方形并與等戊己之戊乙上直角方形等本篇六夫戊乙上直角方形等于甲戊甲乙上兩直角方形并一卷四七即丁辛直角形及甲戊上直角方形并與甲戊甲乙上兩直角方形并等矣次各減同用之甲戊上直角方形即所存丁辛直角形不與甲乙上甲丙直角方形等乎此二率者又各減同用之甲壬直角形則所存己庚直角方形與庚丙直角形等而甲乙偕庚乙矩線内直角形與甲庚上直角方形等也}
