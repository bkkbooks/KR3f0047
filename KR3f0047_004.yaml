body:
  text: 界説七則第一界直線形居他直線形內而此形之各角切他形之各邉為形內切形此卷將論切形在圜之內外及作圜在形之內外故解形之切在形內及切在形外者先以直線形為例如前圖丁戊己角形之丁戊己三角切甲乙丙角形之甲乙乙丙丙甲三邉則丁戊己為甲乙丙之形內切形如後圖癸子丑角形雖癸子兩角切庚辛壬角形之庚辛壬庚兩邉而丑角不切辛壬邉則癸子丑不可謂庚辛壬之形內切形第二界一直線形居他直線形外而此形之各邉切他形之各角為形外切形如第一界圖甲乙丙為丁己戊之形外切形其餘各形倣此二例第三界直線形之各角切圜之界為圜內切形甲乙丙形之三角各切圜界于甲于乙于丙是也第四界直線形之各邉切圜之界為圜外切形甲乙丙形之三邉切圜界于丁于己于戊是也第五界圜之界切直線形之各邉為形內切圜同第四界圖第六界圜之界切直線形之各角為形外切圜同第三界圖第七界直線之兩界各抵圜界為合圜線甲乙線兩界各抵甲乙丙圜之界為合圜線若丙抵圜而丁不至及戊之兩俱不至不為合圜線幾何原本卷四之首欽定四庫全書第一題有圜求作合圜線與所設線等此設線不大于圜之徑線法曰甲乙丙圜求作合線與所設丁線等其丁線不大于圜之徑線徑為圜內之最大線更大不可合見三卷十五先作甲乙圜徑為乙丙若乙丙與丁等者即是合線若丁小于徑者即于乙丙上截取乙戊與丁等次以乙為心戊為界作甲戊圜交甲乙丙圜于甲末作甲乙合線即與丁等何者甲乙與乙戊等則與丁等第二題有圜求作圜內三角切形與所設三角形等角法曰甲乙丙圜求作圜內三角切形其三角與所設丁戊己形之三角各等先作庚辛線切圜于甲三卷十七次作庚甲乙角與設形之己角等次作辛甲丙角與設形之戊角等末作乙丙線即圜內三角切形與所設丁戊己形等角論曰甲丙乙與庚甲乙兩角等甲乙丙與辛甲丙兩角亦等三卷卅二而庚甲乙辛甲丙兩角既與所設己戊兩角各等即甲丙乙甲乙丙亦與己戊各等而乙甲丙必與丁等一卷卅二則三角俱等第三題有圜求作圜外三角切形與所設三角形等角法曰甲乙丙圜求作圜外三角切形其三角與所設丁戊己形之三角各等先于戊己一邉引長之為庚辛次于圜界抵心作甲壬線次作甲壬乙角與丁戊庚等次作乙壬丙角與丁己辛等末于甲乙丙上作癸子子丑丑癸三垂線此三線各切圜于甲于乙于丙三卷十六之系而相遇于子于丑于癸若作甲丙線郎癸甲丙癸丙甲兩角小于兩直角而子癸丑癸兩線必相遇餘二倣此此癸子丑三角與所設丁戊己三角各等論曰甲壬乙子四邉形之四角與四直角等一卷卅二題內而壬甲子壬乙子兩為直角即甲壬乙甲子乙兩角并等兩直角彼丁戊庚丁戊己兩角并亦等兩直角一卷十三此二等率者每減一相等之丁戊庚甲壬乙則所存丁戊己與甲子乙等依顯丑角與丁己戊等則癸與丁亦等一卷卅二而癸子丑與丁戊己兩形之各三角俱等第四題三角形求作形內切圜法曰甲乙丙角形求作形內切圜先以甲乙丙角甲丙乙角各兩平分之一卷九作乙丁丙丁兩直線相遇于丁次自丁至角形之三邉各作垂線為丁己丁庚丁戊其戊丁乙角形之丁戊乙丁乙戊兩角與乙丁己角形之丁己乙丁乙己兩角各等乙丁同邉即丁戊丁己兩邉亦等一卷草六依顯丁丙己角形與丁庚丙角形之丁己丁庚兩邉亦等即丁戊丁己丁庚三線俱等末作圜以丁為心戊為界即過庚己為戊庚己圜而切角形之甲乙乙丙丙甲三邉于戊于己于庚三卷十六之系此為形內切圜第五題三角形求作形外切圜法曰甲乙丙角形求作形外切圜先平分兩邉若形是直角鈍角則分直角鈍角之兩旁邉于丁于戊次于丁戊上各作垂線為己丁己戊而相遇于己若自丁至戊作直線即己丁戊角形之己丁戊己戊丁兩角小于兩直角故丁己戊己兩線必相遇其己點或在形內或在形外俱作己甲己乙己丙三線或在乙丙邉上止作己甲線其甲丁己角形之甲丁與乙丁己角形之乙丁兩腰等丁己同腰而丁之兩旁角俱直角即甲己己乙兩底必等一卷四依顯甲己戊丙己戊兩形之甲己己丙兩底亦等則己甲己乙己丙三線俱等末作圜以己為心甲為界必切丙乙而為角形之形外切圜一系若圜心在三角形內即三角形為鋭角形何者每角在圜大分之上故若在一邉之上即為直角形若在形外即為鈍角形二系若三角形為鋭角形即圜心必在形內若直角形必在一邉之上若鈍角形必在形外增從此推得一法其法先以三點作三直線相聯成三角形第六題有圜求作內切圜直角方形法曰甲乙丙丁圜其心戊求作內切圜直角方形先作甲丙乙丁兩徑線以直角相交于戊次作甲乙乙丙丙丁丁甲四線即甲乙丙丁為內切圜直角方形論曰甲乙戊角形之甲戊與乙戊丙角形之戊丙兩腰等乙戊同腰而腰間角兩為直角即其底甲乙乙丙等一卷四依顯乙丙丙丁亦等則四邉形之四邉俱等而甲乙丙丁四角皆在半圜分之上又皆直角三卷卅一是為內切圜直角方形第七題有圜求作外切圜直角方形法曰甲乙丙丁圜其心戊求作外切圜直角方形先作甲丙乙丁兩經線以直角相交于戊次于甲乙丙丁作庚己己辛辛壬壬庚四線為兩徑之垂線而相遇于己于辛于壬于庚即己庚壬辛為外切圜直角方形論曰甲戊乙己乙戊既皆直角即己辛甲丙平行一卷草八依顯甲丙庚壬亦平行則己庚辛壬亦平行一卷三十又甲丙辛己既直角形即甲丙己辛必等一卷卅四而甲丙辛甲己辛兩角亦等甲丙辛既直角即甲己辛亦直角依顯庚壬辛亦直角而辛壬壬庚庚己三邉俱等于甲丙乙丁兩徑既四邉俱等于兩徑則己庚壬辛為直角方形而四邉各切圜三卷十六之系第八題直角方形求作形內切圜法曰甲乙丙丁直角方形求作形內切圜先以四邉各兩平分于戊于己于庚于辛而作辛己戊庚兩線交于壬其甲丁與乙丙既平行相等即半減線之甲辛乙己亦平行相等而甲乙與辛己亦平行相等一卷卅三依顯丁丙與辛己亦平行相等甲丁乙丙戊庚俱平行相等而甲壬乙壬丙壬丁壬四俱直角形壬戊壬己壬庚壬辛四線與甲辛戊乙丁辛甲戊四線各等夫甲辛戊乙丁辛甲戊各為等線之半即與之等者壬戊壬己壬庚壬辛亦自相等次作圜以壬為心戊為界必過己庚辛而切甲丁丁丙丙乙乙甲四邉三卷十六是為形內切圜第九題直角方形求作形外切圜法曰甲乙丙丁直角方形求作外切圜先作對角兩線為甲丙乙丁而交于戊其甲乙丁角形之甲乙甲丁兩腰等即甲乙丁甲丁乙兩角亦等一卷五而乙甲丁為直角即甲乙丁甲丁乙俱半直角一卷卅二依顯丙乙丁丙丁乙亦俱半直角而四角俱等又戊甲丁戊丁甲兩角等即戊甲戊丁兩邉亦等一卷六依顯戊甲戊乙兩邉亦等而戊乙戊丙兩邉戊丙戊丁兩邉各等次作圜以戊為心甲為界必過乙丙丁而為形外切圜第十題求作兩邉等三角形而底上兩角各倍大于腰間角法曰先任作甲乙線次分之于丙其分法須甲乙偕丙乙矩內直角形與甲丙上直角方形等二卷十一次以甲為心乙為界作乙丁圜次作乙丁合圜線與甲丙等本篇一末作甲丁線相聯其甲乙甲丁等即甲乙丁為兩邉等角形而甲乙丁甲丁乙兩角各倍大于甲角論曰試作丙丁線而甲丙丁角形外作甲丙丁切圜本篇五其甲乙偕丙乙矩內直角形與甲丙上直角方形等即亦與至規外之乙丁上直角方形等而乙丁線切甲丙丁圜于丁三卷卅七即乙丁切線偕丁丙割線所作乙丁丙角與負丁甲丙圜分之甲角交互相等三卷卅二此二率者每加一丙丁甲角即甲丁乙全角與丙甲丁丙丁甲兩角并等夫乙丙丁外角亦與丙甲丁丙丁甲相對之兩內角等一卷卅二即乙丙丁角與甲丁乙全角等而與相等之甲乙丁亦等丙丁與乙丁兩線亦等一卷六夫乙丁元與甲丙等即丙丁與甲丙亦等丙甲丁丙丁甲兩角亦等而甲角既與乙丁丙角等即乙丁丙與丙丁甲兩角亦等是甲丁乙倍大于丙丁甲必倍大于相等之甲角也而相等之甲乙丁亦倍大于甲也第十一題有圜求作圜內五邉切形其形等邉等角法曰甲乙丙丁戊圜求作五邉內切圜形等邉等角先作己庚辛兩邉等角形而庚辛兩角各倍大于己角本篇十次于圜內作甲丙丁角形與己庚辛角形各等角本篇二次以甲丙丁甲丁丙兩角各兩平分一卷九作丙戊丁乙兩線末作甲乙乙丙丙丁丁戊戊甲五線相聯即甲乙丙丁戊為五邉內切圜形而五邉五角俱自相等論曰甲丙丁甲丁丙兩角皆倍大于丙甲丁角而兩角又平分即甲丁乙乙丁丙丙甲丁丁丙戊戊丙甲五角皆等而五角所乘之甲乙乙丙丙丁丁戊戊甲五圜分亦等三卷草六即甲乙乙丙丙丁丁戊戊甲五線亦等三卷草九是五邉形之五邉等又甲乙戊丁兩圜分等而各加一乙丙丁圜分即甲乙丙丁與戊丁丙乙兩圜分等乘兩圜分之甲戊丁乙甲戊兩角亦等依顯餘三角與兩角俱等是五邉形之五角等第十二題有圜求作圜外五邉切形其形等邉等角法曰甲乙丙丁戊圜求作五邉外切圜形等邉等角先作圜內甲乙丙丁戊五邉等邉等角切形本篇十一次從己心作己甲己乙己丙己丁己戊五線次從此五線作庚辛辛壬壬癸癸子子庚五埀線相遇于庚于辛于壬于癸于子庚戊甲庚甲戊兩角小于兩直角故甲庚戊庚線必相遇餘四倣此五埀線既切圜三卷十六即成外切圜五邉形而等邉等角論曰試從己心作己庚己辛己壬己癸己子五線其己甲甲辛上兩直角方形己乙乙辛上兩直角方形之兩并各與己辛上直角方形等一卷四七即兩并自相等此兩并率者每減一相等之甲己己乙上直角方形即所存甲辛辛乙上兩直角方形等則甲辛辛乙兩線等也又甲己辛角形之甲己與乙己辛角形之乙己兩腰等己辛同腰而甲辛辛乙兩底又等即甲己辛辛己乙兩角等一卷八而甲辛己乙辛己兩角亦等一卷四則甲己乙角倍大于辛己乙角也依顯乙己丙角亦倍大于乙己壬角乙壬丙角亦倍大于乙壬己角也又甲己乙乙己丙兩角乘甲乙乙丙相等之又甲己乙乙己丙兩角乘甲乙乙丙相等之兩圜分線等故圜分等見三卷草八故圜分等見三卷草八即兩角自相等三卷草七半減之辛己乙乙己壬兩角亦等乙己辛角形之乙己辛辛乙己兩角與乙己壬角形之乙己壬壬乙己兩角各等而乙己同邉是辛乙乙壬兩邉亦等也一卷草六乙辛己乙壬己兩角亦等也則辛壬線倍大于辛乙線也依顯庚辛線亦倍大于辛甲線也前己顯甲辛辛乙兩線等則倍大之庚辛辛壬兩線亦等也依顯壬癸癸子子庚與庚辛辛壬俱等也是為庚辛壬癸子形之五邉等又依前所顯乙辛己與乙壬己兩角等是乙辛甲之減半角與乙壬丙之減半角等即倍大之乙辛甲與乙壬丙亦等也依顯辛壬癸壬癸子癸子庚子庚辛與庚辛壬俱等也是為庚辛壬癸子形之五角等第十三題五邉等邉等角形求作形內切圜法曰甲乙丙丁戊五邉等邉等角形求作內切圜先分乙甲戊甲乙丙兩角各兩平分一卷九其線為己甲己乙而相遇于己己甲乙己乙甲兩角小于兩直角故己甲己乙兩線必相遇自己作己丙己丁己戊三線其甲己乙角形之甲乙腰與乙己丙角形之乙丙腰等乙己同腰而兩腰間之甲乙己丙乙己兩角等即甲己己丙兩底亦等乙甲己乙丙己兩角亦等一卷四又乙甲戊與乙丙丁兩角等而乙甲己為乙甲戊之半即乙丙己亦乙丙丁之半則乙丙丁角亦兩平分于己丙線矣依顯丙丁戊丁戊甲兩角亦兩平分于己丁己戊兩線矣次從己向各邉作己庚己辛己壬己癸己子五埀線其甲己庚角形之己甲庚己庚甲兩角與甲己子角形之己甲子己子甲兩角各等甲己同邉即兩形必等一卷草六己子與己庚兩線亦等依顯己辛己壬己癸三埀線與己庚己子兩埀線俱等末作圜以己為心庚為界必過辛壬癸子而為甲乙丙丁戊五邉形之內切圜三卷十六第十四題五邉等邉等角形求作形外切圜法曰甲乙丙丁戊五邉等邉等角形求作外切圜先分乙甲戊甲乙丙兩角各兩平分其線為己甲己乙而相遇于己説見前次從己作己丙己丁己戊三線依前題論推顯乙丙丁丙丁戊丁戊甲三角各兩平分于己丙己丁己戊三線夫五角既等即其半減之角亦等而甲乙己角形之己甲乙己乙甲兩角等即甲己與己乙兩線亦等一卷六依顯己丙己丁己戊三線與己甲己乙俱等末作圜以己為心甲為界必過乙丙丁戊而為甲乙丙丁戊五邉形之外切圜第十五題有圜求作圜內六邉切形其形等邉等角法曰甲乙丙丁戊己圜其心庚求作六邊內切圜形等邊等角先作甲丁徑線次以丁為心庚為界作圜兩圜相交于丙于戊次從庚心作丙庚戊庚兩線各引長之為丙己戊乙末作甲乙乙丙丙丁丁戊戊己己甲六線相聨即成甲乙丙丁戊己內切圜六邉形而等邉等角論曰庚丙庚丁兩線等而丁丙與丁庚亦等依圜界説三邉俱等即庚丙丁為平邉角形而庚丁丙丁丙庚丙庚丁三角俱等一卷五此三角元與兩直角等一卷卅二即每角為兩直角三分之一而丙庚丁角為兩直角三分之一也依顯丁庚戊角亦兩直角三分之一而丙庚丁丁庚戊戊庚己三角又等于兩直角一卷十三即戊庚己角亦兩直角三分之一矣則丙庚丁丁庚戊戊庚己三角亦自相等而此三角與己庚甲甲庚乙乙庚丙三角亦等一卷十五是輳庚心之六角俱自相等而所乘之六圜分三卷草六及甲乙乙丙丙丁丁戊戊己己甲六線俱自相等三卷草九則甲乙丙丁戊己形之六邉等乂又乙丙與甲己兩圜分等而各加一丙丁戊己圜分即乙丙丁戊己與甲己戊丁丙兩圜分等而所乘之乙甲己與甲乙丙兩角等三卷草七依顯乙丙丁丙丁戊丁戊己戊己甲四角與乙甲己甲乙丙兩角俱等則甲乙丙丁戊己形之六角等一系凡圜之半徑為六分圜之一之分弦何者庚丁與丁丙等故故一開規為圜不動而可六平分之二系依前十二十三十四題可作六邉等邉等角形在圜之外又六邉等邉等角形內可作切圜又六邉等邉等角形外可作切圜第十六題有圜求作圜內十五邉切形其形等邉等角法曰甲乙丙圜求作十五邉內切圜形等邉等角先作甲乙丙內切圜平邉三角形與丁等角本篇二即三邉等而甲乙乙丙丙甲三圜分亦等三卷草八夫甲乙丙圜十正分之則甲乙三分圜之一當為十五分之五次從甲作甲戊己庚辛內切圜五邉形等角本篇十一即甲戊戊己己庚庚辛辛甲五圜分等三卷草八夫甲乙丙圜十五分之則甲戊五分圜之一當為十五分之三而戊乙得十五分之二次以戊乙圜分兩平分于壬三卷卅則壬乙得十五分之一次作壬乙線依壬乙共作十五合圜線本篇一則成十五邉等邉形而十五角所乘之圜分等即各角亦等三卷草七一系依前十二十三十四題又十五邊形內可作切圜又十五邉形外可作切圜注曰依此法可設一法作無量數形如本題圗甲乙圜分為三分圜之一即命三得十五即知此兩分法可作十五邉形又如甲乙命三增題若圜內從一點設切圜兩不等等邊等角形之各一邊而甲丙為五分圜之一則乙丙得三十分圜之一也依顯乙丁為二十四邉形之二邉也二系凡作形于圜之內等邉則等角何者形之角所乘之圜分皆等故三卷草七凡作形于圜之外即從圜心作直線抵各角依本篇十二題可推顯各角等三系凡等邉形既可作在圜內即依圜內形可作在圜外即形內可作圜即形外亦可作圜皆依本篇十二十三十四題四系凡圜內有一形欲作他形其形邉倍于此形邉即分此形一邉所合之圜分為兩平分而每分各作一合線即三邉可作六邉四邉可作八邉倣此以至無窮又補題圜內有同心圜求作一多邉形切大圜不至小圜其多邉為偶數而等法曰甲乙丙丁戊兩圜同以己為心求于甲乙丙大圜內作多邉切形不至丁戊小圜其多邉為偶數而等先從己心作甲丙徑線截丁戊圜于戊次從戊作庚辛為甲戊之垂線即庚辛線切丁戊圜于戊也三卷十六之系夫甲庚丙圜分雖大于丙庚若于甲庚丙減其半甲乙存乙丙又減其半乙壬存壬丙又減其半壬癸如是遞減至其減餘丙癸必小于丙庚如下補論既得丙癸圜分小于丙庚而作丙癸合圜線即丙癸為所求切圜形之一邉也次分乙壬圜分其分數與丙壬之分數等次分甲乙與乙丙分數等分丙甲與甲乙丙分數等則得所求形三卷草九而不至丁戊小圜論曰試從癸作癸子為甲丙之垂線遇甲丙于丑其庚戊丑癸丑戊兩皆直角即庚辛癸子為平行線一卷草八庚辛線之切丁戊圜既止一點即癸子線更在其外必不至丁戊矣何况丙癸更逺于丑癸乎依顯其餘與丙癸等邉同度距心者三卷十四俱不至丁戊圜也此係十二卷第十六題因六卷今增題宜藉此論故先類附于此補論其題曰兩幾何不等若于大率遞減其大半必可使其減餘小于元設小率解曰甲乙大率丙小率題言于甲乙遞減其大半至可使其減餘小于丙論曰試以丙倍之又倍之至僅大于甲乙而止為丁戊丁戊之分為丁己己庚庚戊各與丙等也次于甲乙減其大半甲辛存辛乙又減其大半辛壬存壬乙如是遞減至甲乙與丁戊之分數等夫甲辛辛壬壬乙與丁己己庚庚戊分數既等丁戊又大于甲乙若兩率各為兩分而大丁戊之減丁己止于半小甲乙之減甲辛為大半即丁戊之減餘必大于甲乙之減餘也若各為多分而己戊尚多于丙者即又于己戊減己庚于辛乙減其大半辛壬如是遞減卒至丁戊之末分庚戊大于甲乙之末分壬乙也而庚戊元與丙等是壬乙小于丙也又論曰若于甲乙遞減其半亦同前論何者大丁戊所減不大于半則丁戊之減餘每大于甲乙之減餘以至末分亦大于末分此係十卷第一題借用于此以足上論
