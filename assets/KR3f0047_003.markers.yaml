  - {type: variant, offset: 6105, length: 0, content: '', WYG: 試作甲丁壬角與戊甲辛角等其甲丁壬辛甲丁兩角并等于戊甲丁直角必小于兩直角而丁壬甲辛兩線必相遇分論十一其相遇又必在圜之内如壬何者壬甲丁壬丁甲兩角既與一直角等即甲壬丁必為直角一卷卅二而對大角之甲丁線必大于對小角之丁壬線矣一卷十九夫甲丁線僅至圜界則丁壬不能抵圜界必在圜之内也後支前已正論或難曰切邊角有大有小何以畢不得兩分向者聞幾何之分不可窮盡如莊子尺棰之義深著明矣今切邊之内有角非幾何乎此幾何何獨不可分邪又十卷第一題言設一小幾何又設一大幾何若從大者半減之減之又減必至一處小于所設小率此題最明無可疑者今言切邊之角小于直線鋭角是亦小幾何也彼直線鋭角是亦大幾何也若從直線鋭角半減之減之又減何以終竟不得小于切邊角邪既本題推顯切邊角中不得容一直線如此著明便當并無切邊角無角則無幾何此則不可得分耳且幾何原本書中無有至大不可加之率無有至小不可減之率若切邊角不可分豈非至小不可減乎答曰謬矣子之言也有圜有線安得無切邊角且既言直線鋭角大于切邊角即有切邊角矣苟無角安所較大小哉且子言直線與圜界并無切邊角則兩圜外相切亦無角乎曰然曰試如作甲己乙圜其心丙而丁戊為切線即丁甲己為切邊角次移心于庚又作甲辛癸圜即丁甲辛為切邊角而小于丁甲己次移心于子又作甲丑寅圜即丁甲丑為切邊角而又小于丁甲辛如是小之又小疑無角焉次又于切線之外以辰為心作甲己午圜而與前圜外相切于甲依子所説疑無角焉然兩圜外相切而以丁戊線分之不可分乎更自辰至寅作直線截兩圜之界而分丁戊為兩平分不可分乎兩圜兩直線交羅相遇于甲也能不皆以一㸃乎如以一㸃也即此一㸃之外不能無空即不能不為四切邊角矣子所據尺棰之分無盡又言幾何原本書中無至小不可減之率也是也夫切邊角但不可以直線分之耳若用圜線則可分矣如甲乙庚圜與丙甲丁直線相切于甲作丁甲庚切邊大角若移一心作甲戊辛圜又得丁甲辛切邊角即小于丁甲庚也又移一心作甲己壬圜又得丁甲壬切邊小角即又小于丁甲辛也如此以至無窮則切邊角分之無盡何謂不可減邪若十卷第一題所言元無可疑但以圜角分圜角則與其説合矣彼所言大小兩幾何者謂夫能相較為大能相較為小者也如以直線分直線角以圜線分圜線角是已此切邊角與直線角豈能相較為大小哉}
