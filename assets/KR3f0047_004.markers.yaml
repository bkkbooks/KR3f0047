  - {type: variant, offset: 5235, length: 0, content: '', WYG: 此兩邊一爲若干分圜之一一爲若干分圜之一此兩若干分相乗之數卽後作形之邊數此兩若干分之較數卽兩邊相距之圜分所得後作形邊數内之分數法曰甲乙丙丁戊圜内從甲㸃作數形之各一邊如甲乙爲六邊形之一邊甲丙爲五邊形之一邊甲丁爲四邊形之一邊甲戊爲三邊形之一邊甲乙命六甲丙命五較數一卽乙丙圜分爲所作三十邊等邊等角形之一邊何者五六相乗爲三十故當作三十邊也較數一故當爲一邊也論曰甲乙圜分爲六分圜之一卽得三十分圜之五}
