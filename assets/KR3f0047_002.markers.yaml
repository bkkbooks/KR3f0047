  - {type: variant, offset: 1083, length: 0, content: '', WYG: 以數明之設十數任兩分之為七為三如前圖則十乘七為七十與七乘三之實二十一及七自之羃四十九并等如後圖十乘三為三十與七乘三之實二十一及三之羃九并等第四題一直線任兩分之其元線上直角方形與各分上兩直角方形及兩分互偕矩線内兩直角形并等解曰甲乙線任兩分于丙題言甲乙線上直角方形與甲丙丙乙線上兩直角方形及甲丙偕丙乙丙乙偕甲丙矩線内兩直角形并等論曰試于甲乙線上作甲丁直角方形次作乙戊對角線次從丙作丙己線與乙丁平行遇對角線于庚末從庚作辛壬線與甲乙平行而分本形為四直角形即甲乙戊角形之甲乙甲戊兩邊等而甲乙戊與甲戊乙兩角亦等一卷五夫甲乙戊形之三角并與兩直角等一卷卅二而甲為直角即甲乙戊甲戊乙皆半直角一卷卅之二系依顯丁乙戊角形之丁乙戊丁戊乙兩角亦皆半直角則戊己庚外角與内角丁等為直角一卷卅九而己戊度既半直角則己庚戊等為半直角矣角既等則己庚己戊兩邊亦等一卷六庚辛辛戊亦等一卷卅四而辛巳為直角方形也依顯丙壬亦直角方形也又庚辛與甲丙兩對邊等一卷卅四而乙丙與庚丙俱為直角方形邊亦等則辛己為甲丙線上直角方形丙壬為丙乙線上直角方形也又甲庚及庚丁兩直角形各在甲丙丙乙矩線内也則甲丁直角方形與甲丙丙乙兩線上兩直角方形及兩線矩内兩直角形并等矣系從此推知凡直角方形之角線形皆直角方形又論曰甲乙線既任分于丙則元線甲乙上直角方形與元線偕各分線矩内兩直角形并等本篇二又甲乙偕甲丙矩線内直角形與甲丙偕丙乙矩線内直角形及甲丙上直角方形并等本篇三甲乙偕丙乙矩線内直角形與丙乙偕甲丙矩線内直角形及丙乙上直角方形并等本篇三則甲乙上直角方形與甲丙丙乙上兩直角方形及甲丙偕丙乙丙乙偕甲丙矩線内兩直角形并等}
