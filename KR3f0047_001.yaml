body:
  text: 卷一之首凡造論先當分别解說論中所用名目故曰界說凡厯法地理樂律筭章技茿工巧諸事有度有數者皆依賴十府中幾何府屬凡論幾何先從一㸃始自㸃引之為線線展為靣靣積為體是名三度第一界㸃者無長短廣狹厚薄如下圖凡圖十干為識干盡用十二支支盡用八卦八音第二界線有長無廣試如一平靣光照之有光無光之間不容一物是線也眞平眞圓相遇其遇處止有一㸃行則止有一線線有直有曲第三界線之界是㸃凡線有界者兩界必是㸃第四界直線止有兩端兩端之間上下更無一㸃兩㸃之間至徑者直線也稍曲則繞而長矣直線之中㸃能遮兩界凡量遠近皆用直線甲乙丙是直線甲丁丙甲戊丙甲己丙皆是曲線第五界靣者止有長有廣一體所見為靣求作四則求作者不得言不可作第一求自此㸃至彼㸃求作一直線此求亦出上篇葢自此㸃直行至彼㸃即是直線自甲至乙或至丙至丁俱可作直線第二求一有界直線求從彼界直行引長之如甲乙線從乙引至丙或引至丁俱一直行第三求不論大小以㸃為心求作一圜第四求設一度于此求作彼度較此度或大或小凡言度者或線或面或體皆是或言較小作大可作較大作小不可作何者小之至極數窮盡故也此說非是凡度與數不同數者可以長不可以短長數無窮短數有限如百數減半成五十減之又減至一而止一以下不可損矣自百以上增之可至無窮故曰可長不可短也度者可以長亦可以短長者增之可至無窮公論十九則公論者不可疑第一論設有多度彼此俱與他等則彼與此自相等第二論有多度等若所加之度等則合并之度亦等第三論有多度等若所減之度等則所存之度亦等第四論有多度不等若所加之度等則合并之度不等第五論有多度不等若所减之度等則所存之度不等第六論有多度俱倍于此度則彼多度俱等第七論有多度俱半于此度則彼多度亦等第八論有二度自相合則二度必等以一度加一度之上第九論全大于其分如一尺大于一寸寸者全尺中十分中之一分也第十論直角俱相等見界說十第十一論有二横直線或正或偏任加一縱線若三線之間同方兩角小于兩直角則此二横直線愈長愈相近必至相遇甲乙丙丁二横直線任意作一戊巳縱線或正或偏若戊巳線旁同方兩角俱小于直角或并之小于兩直角則甲乙丙丁線愈長愈相近必有相遇之處欲明此理宜察平行線不得相遇者界說卅四加一垂線即三線之間定為直角便知此論兩角小于直角者其行不得不相遇矣第十二論兩直線不能為有界之形第十三論兩直線止能于一㸃相遇如云線長界近相交不止一㸃試于丙乙二界各出直線交于丁假令其交不止一㸃當引至甲則甲丁乙宜為甲丙乙圜之徑而甲丁丙亦如之界說十七夫甲丁乙圜之右半也而甲丁丙亦右半也界說十七甲丁乙為全甲丁丙為其分而俱稱右半是全與其分等也本篇九第十四論有幾何度等若所加之度各不等則合并之差與所加之差等甲乙丙丁線等于甲乙加乙戊于丙丁加丁巳則甲戊大于丙巳者庚戊線也而乙戊大于丁巳亦如之第十五論有幾何度不等若所加之度等則合并所贏之度與元所贏之度等如上圖反說之戊乙巳丁線不等于戊乙加乙甲于巳丁加丁丙則戊甲大于巳丙者戊庚線也而戊乙大于巳丁亦如之第十六論有幾何度等若所減之度不等則餘度所贏之度與減去所贏之度等甲乙丙丁線等于甲乙減戊乙于丙丁減巳丁則乙戊大于丁巳者庚戊也而丙巳大于甲戊亦如之第十七論有幾何度不等若所減之度等則餘度所贏之度與元所贏之度等如十四論反說之甲戊丙巳線不等于甲戊減甲乙于丙巳減丙丁則乙戊長于丁巳者亦庚戊也與甲戊長于丙巳者等矣第十八論全與諸分之并等第十九論有二全度此全倍于彼全若此全所減之度倍于彼全所減之度則此較亦倍于彼較相减之餘曰較如此度二十彼度十于二十減六于十減三則此較十四彼較七幾何原本第一卷之首終幾何原本第一卷泰西利瑪竇口譯吳淞涂光啓筆受第一題于有界直線上求立平邊三角形法曰甲乙直線上求立平邊三角形先以甲為心乙為界作丙乙丁圜次以乙為心甲為界作丙甲丁圜兩圜相交于丙于丁末自甲至丙丙至乙各作直線即甲乙丙為平邊三角形論曰以甲為心至圜之界其甲乙線與甲丙甲丁線等以乙為心則乙甲線與乙丙乙丁線亦等何者凡為圜自心至界各線俱等故界説十五既乙丙等于乙甲而甲丙亦等于甲乙郎甲丙亦等于乙丙公論一三遍等如所求如所求凡論有二種此以是為論者正論也下倣此其用法不必作兩圜但以甲為心乙為界作近丙一短界線乙為心甲為界亦如之兩短界線交處即得丙諸三角形第二題一直線線或內或外有一㸃求以㸃為界作直線與元線等法曰有甲㸃及乙丙線求以甲為界作一線與乙丙等先以丙為心乙為界乙為心丙為界亦可作作丙乙圜第三求次觀甲㸃若在丙乙之外則自甲至丙作甲丙線第一求如上前圖或甲在丙乙之內則截取甲至丙一分線如上後圖兩法俱以甲丙線為底任于上下作甲丁丙平邊三角形本篇一次自三角形兩腰線引長之第二求其丁丙引至丙乙圜界而止為丙戊線其丁甲引之出丙乙圜外稍長為甲巳線末以丁為心戊為界作丁戊圜其甲巳線與丁戊圜相交于庚即甲庚線與乙丙線等論曰丁戊丁庚線同以丁為心戊庚為界故等界説十五于丁戊線減丁丙丁庚線減丁甲其所減兩腰線等則所存亦等公論三夫丙戊與丙乙同以丙為心戊乙為界亦等界説十五即甲庚與丙乙等公論一若所設甲㸃即在丙乙線之一界其法尤易假如㸃在丙即以丙為心作乙戊圜從丙至戊即所求第三題兩直線一長一短求于長線減去短線之度法曰甲短線乙丙長線求于乙丙減甲先以甲為度從乙引至别界作乙丁線本篇二次以乙為心丁為界作圜第三求圜界與乙丙交于戊即乙戊與等甲之乙丁等盖乙丁乙戊同心同圜故界説十五第四題兩三角形若相當之兩腰線各等各兩腰線間之角等則兩底線必等而兩形亦等其餘各兩角當者俱等解曰甲乙丙丁戊巳兩三角形之甲與丁兩角等甲丙與丁巳兩線甲乙與丁戊兩線各等題言乙丙與戊巳兩底線必等而兩三角形亦等甲乙丙與丁戊巳兩角甲丙乙與丁巳戊兩角俱等論曰如云乙丙與戊巳不等即令將甲角置丁角之上兩角必相合無大小甲丙與丁巳甲乙與丁戊亦必相合無大小公論八此二俱等而云乙丙與戊巳不等必乙丙底或在戊巳之上為庚或在其下為辛矣戊巳既為直線而戊庚巳又為直線則兩線當别作一形是兩線能相合為形也辛倣此公論十二此以非為論者駁論也下倣此第五題三角形若兩腰等則底線兩端之兩角等而兩腰引出之其底之处兩角亦等解曰甲乙丙三角形其甲丙與甲乙兩腰等題言甲丙乙與甲乙丙兩角等又自甲丙線任引至戊甲乙線任引至丁其乙丙戊與丙乙丁兩外角亦等論曰試如甲戊線稍長即從甲戊截取一分與甲丁等為甲巳本篇三次自丙至丁乙至巳各作直線第一求即甲巳乙甲丁丙兩三角形必等何者此兩形之甲角同甲巳與甲丁兩腰又等甲乙與甲丙兩腰又等則其底丙丁與乙巳必等而底線兩端相當之各兩角亦等矣本四篇又乙丙巳與丙乙丁兩三角形亦等何者此兩形之丙丁乙與乙巳丙兩角既等本論而甲巳甲丁兩腰各減相等之甲丙甲乙線即所存丙巳乙丁兩腰又等公論三丙丁與乙巳兩底又等本論又乙丙同腰即乙丙丁與丙乙巳兩角亦等也則丙之外乙丙巳角與乙之外丙乙丁角必等矣本篇四次觀甲乙巳與甲丙丁兩角既等于甲乙巳減丙乙巳角甲丙丁減乙丙丁角則所存甲丙乙與甲乙丙兩角必等公論三増從前形知三邊等形其三角俱等第六題三角形若底線两端之两角等則两腰亦等解曰甲乙丙三角形其甲乙丙與甲丙乙两角等題言甲乙與甲丙两腰亦等論曰如云两腰線不等而一長一短試辯之若甲乙為長線即令比甲丙線截去所長之度為乙丁線而乙丁與甲丙等本篇三次自丁至丙作直線則本形成两三角形其一為甲乙丙其一為丁乙丙而甲乙丙全形與丁乙丙分形同也是全與其分等也公論九何者彼言丁乙丙分形之乙丁與甲乙丙全形之甲丙两線既等丁乙丙分形之乙丙與甲乙丙全形之乙丙又同線而元設丁乙丙與甲丙乙两角等則丁乙丙與甲乙丙两形亦等也本篇四是全與其分等也故底線两端之两角等者两腰必等也第七題一線為底出两腰線其相遇止有一㸃不得别有腰線與元腰線等而于此㸃外相遇解曰甲乙線為底于甲于乙各出一線至丙㸃相遇題言此為一定之處不得于甲上更出一線與甲丙等乙上更出一線與乙丙等而不于丙相遇論曰若言有别相遇于丁者即問丁當在丙内邪丙外邪若言丁在丙内則有二説俱不可通何者若言丁在甲丙元線之内則如第一圖丁在甲丙两界之間矣如此即甲丁是甲丙之分而云甲丙與甲丁等也是全與其分等也公論九若言丁在甲丙乙三角頂間則如第二圖丁在甲丙乙之間矣即令自丙至丁作丙丁線而乙丁丙甲丁丙又成两三角形次從乙丁引出至巳從乙丙引出至戊則乙丁丙形之乙丁乙丙两腰等者其底線两端之兩角乙丁丙乙丙丁宜亦等也其底之外两角巳丁丙戊丙丁宜亦等也本篇五而甲丁丙形之甲丁甲丙两腰等者其底線两端之兩角甲丙丁甲丁丙宜亦等也本篇五夫甲丙丁角本小于戊丙丁角而為其分今言甲丁丙與甲丙丁两角等則甲丁丙亦小于戊丙丁矣何況巳丁丙又甲丁丙之分更小于戊丙丁可知何言底外两角等乎若言丁在丙外又有三説俱不可通何者若言丁在甲丙元線外是丁甲即在丙甲元線之上則甲丙與甲丁等矣即如上第一説駁之若言丁在甲丙乙三角頂外即如上第二説駁之若言丁在丙外而後出二線一在三角形内一在其外甲丁線與乙丙線相交如第五圖即令將丙丁相聯作直線是甲丁丙又成一三角形而甲丙丁宜與甲丁丙两角等也本篇五夫甲丁丙角本小于丙丁乙角而為其分據如彼論則甲丙丁角亦小于丙丁乙角矣又丙丁乙亦成一三角形而丙丁乙宜與丁丙乙两角等也本篇五夫丁丙乙角本小于甲丙丁角而為其分據如彼論則丙丁乙角亦小于甲丙丁角矣此二説者豈不自相戾乎第八題两三角形若相當之两腰各等两底亦等則两腰間角必等解曰甲乙丙丁戊巳两三角形其甲乙與丁戊两腰甲丙與丁巳两腰各等乙丙與戊巳两底亦等題言甲與丁两角必等論曰試以丁戊巳形加于甲乙丙形之上問丁角在甲角上邪否邪若在上即两角等矣公論八或謂不然乃在于庚即問庚當在丁戊線之内邪或在三角頂之内邪或在三角頂之外邪皆依前論駁之本篇七系本題止論甲丁角若旋轉依法論之即三角皆同可見凡線等則角必等不可疑也第九題有直線角求两平分之法曰乙甲丙角求两平分之先于甲乙線任截一分為甲丁本篇三次于甲丙亦截甲戊與甲丁等次自丁至戊作直線次以丁戊為底立平邊三角形本篇一為丁戊巳形末自巳至甲作直線即乙甲丙角為两平分論曰丁甲巳與戊甲巳两三角形之甲丁與甲戊两線等甲巳同是一線戊巳與丁巳两底又等何言两底等初從戊丁底作此三角平形此二線為腰各等戊丁故則丁甲巳與戊甲巳两角必等本篇八用法如上截取甲丁甲戊即以丁為心向乙丙間任作一短界線次用元度以戊為心亦如之两界線交處得巳本篇一第十題一有界線求两平分之法曰甲乙線求两平分先以甲乙為底作甲乙丙两邊等三角形本篇一次以甲丙乙角两平分之本篇九得丙丁直線即分甲乙于丁論曰丙丁乙丙丁甲两三角形之丙乙丙甲两腰等而丙丁同線甲丙丁與乙丙丁两角又等本篇九則甲丁與乙丁两線必等本篇四用法以甲為心任用一度但須長于甲乙線之半向上向下各作一短界線次用元度以乙為心亦如之两界線交處即丙丁末作丙丁直線即分甲乙于戊第十一題一直線任于一㸃上求作垂線法曰甲乙直線任指一㸃于丙求丙上作垂線先于丙左右任用一度各截一界為丁為戊本篇二次以丁戊為底作两邊等角形本篇一為丁巳戊末自巳至丙作直線即巳丙為甲乙之垂線論曰丁巳丙與戊巳丙两角形之巳丁巳戊两腰等而巳丙同線丙丁與丙戊两底又等即两形必等丁與戊两角亦等本篇五丁巳丙與戊巳丙两角亦等本篇八九則丁丙巳與戊丙巳兩角必等矣等即是直角直角即是垂線界説十此後三角形多稱角形省文也用法于丙㸃左右如上截取丁與戊即以丁為心任用一度但須長于丙丁線向丙上方作短界線次用元度以戊為心亦如之两界線交處即巳第十二題有無界直線線外有一㸃求于㸃上作垂線至直線上法曰甲乙線外有丙㸃求從丙作垂線至甲乙先以丙為心作一圜令两交于甲乙線為丁為戊次從丁戊各作直線至丙次两平分丁戊于巳本篇十末自丙至巳作直線即丙巳為甲乙之垂線論曰丙巳丁丙巳戊两角形之丙丁丙戊两線等丙巳同線則丙戊巳與丙丁巳两角必等本篇八而丁丙巳與戊丙巳两角又等則丙巳丁與丙巳戊等皆直角本篇四而丙巳定為垂線矣用法以丙為心向直線两處各作短界線為甲為乙次用元度以甲為心向丙㸃相望處作短界線乙為心亦如之两界線交處為丁末自丙至丁作直線則丙戊為垂線第十三題一直線至他直線上所作两角非直角即等于两直角解曰甲線下至丙丁線遇于乙其甲乙丙與甲乙丁作两角題言此两角當是直角若非直角即是一鋭一鈍而并之等于两直角論曰試于乙上作垂線為戊乙本篇十一令戊乙丙與戊乙丁為兩直角即甲乙丁甲乙戊兩鋭角并之與戊乙丁直角等矣次于甲乙丁甲乙戊兩鋭角又加戊乙丙一直角并此三角定與戊乙丙戊乙丁兩直角等也公論十八次于甲乙戊又加戊乙丙并此鋭直兩角定與甲乙丙鈍角等也次于甲乙戊戊乙丙鋭直兩角又加甲乙丁鋭角并此三角定與甲乙丁甲乙丙鋭鈍兩角等也夫甲乙丁甲乙戊戊乙丙三角既與兩直角等則甲乙丁與甲乙丙兩角定與兩直角等公論一第十四題一直線于線上一㸃出不同方兩直線偕元線每旁作兩角若每旁兩角與兩直角等即後出兩線為一直線解曰甲乙線于丙㸃上左出一線為丙丁右出一線為丙戊若甲丙戊甲丙丁兩角與兩直角等題言丁丙與丙戊是一直線論曰如云不然令别作一直線必從丁丙更引出一線或離戊而上為丁丙巳或離戊而下為丁丙庚也若上于戊則甲丙線至丁丙巳直線上為甲丙巳甲丙丁兩角此兩角宜與兩直角等本篇十三如此即甲丙戊甲丙丁兩角與甲丙巳甲丙丁兩角亦等矣試減甲丙丁角而以甲丙戊與甲丙巳兩角較之果相等乎公論三夫甲丙巳本小于甲丙戊而為其分今曰相等是全與其分等也公論九若下于戊則甲丙線至丁丙庚直線上為甲丙庚甲丙丁兩角此兩角宜與兩直角等本篇十三如此即甲丙庚甲丙丁兩角與甲丙戊甲丙丁兩角亦等矣試減甲丙丁角而以甲丙戊與甲丙庚較之果相等乎公論三夫甲丙戊實小于甲丙庚而為其分今曰相等是全與其分等也公論九兩者皆非則丁丙戊是一直線第十五題凡兩直線相交作四角每兩交角必等解曰甲乙與丙丁兩線相交于戊題言甲戊丙與丁戊乙兩角甲戊丁與丙戊乙兩角各等論曰丁戊線至甲乙線上則甲戊丁丁戊乙兩角與兩直角等本篇十三甲戊線至丙丁線上則甲戊丙甲戊丁兩角與兩直角等本篇十三如此即丁戊乙甲戊丁兩角亦與甲戊丁甲戊内兩角等公論十試減同用之甲戊丁角其所存丁戊乙甲戊丙兩角必等公論三又丁戊線至甲乙線上則甲戊丁丁戊乙兩角與兩直角等本篇十三乙戊線至丙丁線上則丁戊乙丙戊乙兩角與兩直角等本篇十三如此即甲戊丁丁戊乙兩角亦與丁戊乙丙戊乙兩角等公論十試減同用之丁戊乙角其所存甲戊丁丙戊乙必等一系推顯兩直線相交于中㸃上作四角與四直角等二系一㸃之上兩直線相交不論幾許線幾許角定與四直角等公論十八增題而所作甲丙戊丁丙乙兩交角等或甲丙丁戊丙乙兩交角等論曰每加一戊丙乙角公論二第十六題凡三角形之外角必大于相對之各角解曰甲乙丙角形自乙甲線引之至丁題言外角丁甲丙必大于相對之内角甲乙丙甲丙乙論曰欲顯丁甲丙角大于甲丙乙角試以甲丙線兩平分于戊本篇十自乙至戊作直線引長之從戊外截取戊巳與乙戊等本篇三次自甲至巳作直線即甲戊巳戊乙丙兩角形之戊巳與戊乙兩線等戊甲與戊丙兩線等甲戊巳乙戊丙兩交角又等本篇十五則甲巳與乙丙兩底亦等本篇四兩形之各邊各角俱等而巳甲戊與戊丙乙兩角亦等矣夫巳甲戊乃丁甲丙之分則丁甲丙大于巳甲戊亦大于相等之戊丙乙而丁甲丙外角不大于相對之甲丙乙内角乎次顯丁甲丙大于甲乙丙試自丙甲線引長之至庚次以甲乙線兩平分于辛本篇十自丙至辛作直線引長之從辛外截取辛壬與丙辛等本篇三次自甲至壬作直線依前論推顯甲辛壬辛丙乙兩角形之各邊各角俱等則壬甲辛與辛乙丙兩角亦等矣夫壬甲辛乃庚甲乙之分必小于庚甲乙也庚甲乙又與丁甲丙兩交角等本篇十五則甲乙丙内角不小于丁甲丙外角乎其餘乙丙上作外角俱大于相對之内角依此推顯第十七題凡三角形之每兩角必小于兩直角解曰甲乙丙角形題言甲乙丙甲丙乙兩角丙甲乙甲乙丙兩角甲丙乙丙甲乙兩角皆小于兩直角論曰試用兩邊線丙甲引出至戊丙乙引出至丁即甲乙丁外角大于相對之甲丙乙内角矣本篇十六此兩率者每加一甲乙丙角則甲乙丁甲乙丙必大于甲丙乙甲乙丙矣公論四夫甲乙丁甲乙丙與兩直角等也本篇十三則甲丙乙甲乙丙小于兩直角也餘二倣此第十八題凡三角形大邊對大角小邊對小角解曰甲乙丙角形之甲丙邊大于甲乙邊乙丙邊題言甲乙丙角大于乙丙甲角乙甲丙角論曰甲丙邊大于甲乙邊即于甲丙線上截甲丁與甲乙等本篇三自乙至丁作直線則甲乙丁與甲丁乙兩角等矣本篇五夫甲丁乙角者乙丙丁角形之外角必大于相對之丁丙乙内角本篇十六則甲乙丁角亦大于甲丙乙角而況甲乙丙又函甲乙丁于其中不又大于甲丙乙乎如乙丙邊大于甲乙邊則乙甲丙角亦大于甲丙乙角依此推顯第十九題凡三角形大角對大邊小角對小邊解曰甲乙丙角形乙角大于丙角題言對乙角之甲丙邊必大于對丙角之甲乙邊論曰如云不然令言或等或小若言甲丙與甲乙等則甲丙角宜與甲乙角等矣本篇五何設乙角大于丙角也若言甲丙小于甲乙則甲丙邊對甲乙大角宜大本篇十八又何言小也如甲角大于丙角則乙丙邊大于甲乙邊依此推顯第二十題凡三角形之兩邊并之必大于一邊解曰甲乙丙角形題言甲丙甲乙邊并之必大于乙丙邊甲丙丙乙并之必大于甲乙甲乙乙丙并之必大于甲丙論曰試于丙甲邊引長之以甲乙為度截取甲丁本篇三自丁至乙作直線令甲丁甲乙兩腰等而甲丁乙甲乙丁兩角亦等本篇五即丙乙丁角大于甲乙丁角亦大于丙丁乙角矣夫丁丙邊對丙乙丁大角也豈不大于乙丙邊對丙丁乙小角者乎本篇十九又甲丁甲乙兩線各加甲丙線等也則甲乙加甲丙者與丙丁等矣丙丁既大于乙丙則甲乙甲丙兩邊并必大于乙丙邊也餘二倣此第二十一題凡三角形于一邊之兩界出兩線復作一三角形在其内則内形兩腰并之必小于相對兩腰而後兩線所作角必大于相對角解曰甲乙丙角形于乙丙邊之兩界各出一線遇于丁題言丁丙丁乙兩線并必小于甲乙甲丙并而乙丁丙角必大于乙甲丙角論曰試用内一線引長之如乙丁引之至戊即乙甲戊角形之乙甲甲戊兩線并必大于乙戊線也本篇二十此二率者每加一戊丙線則乙甲甲戊戊丙并必大于乙戊戊丙并矣公論四又戊丁丙角形之戊丁戊丙線并必大于丁丙線也此二率者每加一丁乙線則戊丁戊丙丁乙并必大于丁丙丁乙并矣公論四夫乙甲甲戊戊丙既大于乙戊戊丙豈不更大于丁丙丁乙乎本篇二十又乙甲戊角形之丙戊丁外角大于相對之乙甲戊内角本篇十六即丁戊丙角形之乙丁丙外角更大于相對之丁戊丙内角矣而乙丁丙角豈不更大于乙甲丙角乎第二十二題三直線求作三角形其每兩線并大于一線也法曰甲乙丙三線其第一第二線并大于第三線若兩線比第三線或等或小即不能作三角形見本篇二十求作三角形先任作丁戊線長于三線并次以甲為度從丁截取丁巳線本篇三以乙為度從巳截取巳庚線以丙為度從庚截取庚辛線次以巳為心丁為界作丁壬癸圜以庚為心辛為界作辛壬癸圜其兩圜相遇下為壬上為癸末以庚巳為底作癸庚癸巳兩直線即得巳癸庚三角形用壬亦可作若丁壬癸圜不到子辛壬癸圜不到丑即是兩或等或小于第三線不成三角形矣論曰此角形之丁巳巳癸線皆同圜之半徑等界説十五則巳癸與甲等庚辛庚癸線亦皆同圜之半徑等則庚癸與丙等巳庚元以乙為度則角形三線與所設三線等用法任以一線為底以底之一界為心第二線為度向上作短界線次以又一界為心第三線為度向上作短界線兩界線交處向下作兩腰如所求若設一三角形求别作一形與之等亦用此法第二十三題一直線任于一㸃上求作一角與所設角等法曰甲乙線于丙㸃求作一角與丁戊巳角等先于戊丁線任取一㸃為庚于戊巳線任取一㸃為辛自庚至辛作直線次依甲乙線作丙壬癸角形與戊庚辛角形等本篇卄二即丙壬丙癸兩腰與戊庚戊辛兩腰等壬癸底與庚辛底又等則丙角與戊角必等本篇八第二十四題兩三角形相當之兩腰各等若一形之腰間角大則底亦大解曰甲乙丙與丁戊巳兩角形其甲乙與丁戊兩腰甲丙與丁巳兩腰各等若乙甲丙角大于戊丁巳角題言乙丙底必大于戊巳底論曰試依丁戊線從丁㸃作戊丁庚角與乙甲丙角等本篇卄三則戊丁庚角大于戊丁巳角而丁庚腰在丁巳之外矣次截丁庚線與丁巳等本篇三即丁庚丁巳俱與甲丙等又自戊至庚作直線是甲乙與丁戊甲丙與丁庚腰線各等乙甲丙與戊丁庚兩角亦等而乙丙與戊庚兩底必等也本篇四次問所作戊庚底今在戊巳底上邪抑同在一線邪抑在其下邪若在上即如第二圖自巳至庚作直線則丁庚巳角形之丁庚丁巳兩腰等而丁庚巳與丁巳庚兩角亦等矣本篇五夫戊庚巳角乃丁庚巳角之分必小于丁庚巳亦必小于相等之丁巳庚而丁巳庚又戊巳庚角之分則戊庚巳益小于戊巳庚也公論九則對戊庚巳小角之戊巳腰必小于對戊巳庚大角之戊庚腰也本篇十九若戊巳與戊庚兩底同線即如第四圖戊巳乃戊庚之分則戊巳必小于戊庚也公論九若戊庚在戊巳之下即如第六圖自巳至庚作直線次引丁庚線出于壬引丁巳線出于辛則丁庚丁巳兩腰等而辛巳庚壬庚巳兩外角亦等矣本篇五夫戊庚巳角乃壬庚巳角之分必小于壬庚巳亦必小于相等之辛巳庚而辛巳庚又戊巳庚角之分則戊庚巳益小于戊巳庚也公論九則對戊庚巳小角之戊巳腰必小于對戊巳庚大角之戊庚腰也本篇十九是三戊巳皆小于等戊庚之乙丙本篇四也第二十五題兩三角形相當之兩腰各等若一形之底大則腰間角亦大解曰甲乙丙與丁戊巳兩角形其甲乙與丁戊甲丙與丁巳各兩腰等若乙丙底大于戊巳底題言乙甲丙角大于戊丁巳角論曰如云不然令言或小或等若言等則兩形之兩腰各等腰間角又等宜兩底亦等本篇四何設乙丙底大也若言乙甲丙角小則對乙甲丙角之乙丙線宜亦小本篇廿四何設乙丙底大也第二十六題二支兩三角形有相當之兩角等及相當之一邊等則餘兩邊必等餘一角亦等其一邊不論在兩角之内及一角之對先解一邊在兩角之内者曰甲乙丙角形之甲乙丙甲丙乙兩角與丁戊巳角形之丁戊巳丁巳戊兩角各等在兩角内之乙丙邊與戊巳邊又等題言甲乙與丁戊兩邊甲丙與丁巳兩邊各等而乙甲丙角與戊丁巳角亦等論曰如云兩邊不等而丁戊大于甲乙令于丁戊線截取庚戊與甲乙等本篇三次自庚至巳作直線即庚戊巳角形之庚戊戊巳兩邊宜與甲乙乙丙兩邊等矣夫乙角與戊角元等則甲丙與庚巳宜等本篇四而庚巳戊角與甲丙乙角宜亦等也本篇四既設丁巳戊與甲丙乙兩角等今又言庚巳戊與甲丙乙兩角等是庚巳戊與丁巳戊亦等全與其分等矣公論九以此見兩邊必等兩邊既等則餘一角亦等後解相等邊不在兩角之内而在一角之對者曰甲乙丙角形之乙角丙角與丁戊巳角形之戊角丁巳戊角各等而對丙之甲乙邊與對巳之丁戊邊又等題言甲丙與丁巳兩邊丙乙與巳戊兩邊各等而甲角與戊丁巳角亦等論曰如云兩邊不等而戊巳大于乙丙令于戊巳線截取戊庚與乙丙等本篇三次自丁至庚作直線即丁戊庚角形之丁戊戊庚兩邊宜與甲乙乙丙兩邊等矣夫乙角與戊角元等則甲丙與丁庚宜等本篇四而丁庚戊角與甲丙乙角宜亦等也既設丁巳戊與甲丙乙兩角等今又言丁庚戊與甲丙乙兩角等是丁庚戊外角與相對之丁巳戊内角等矣本篇十六可乎以此見兩邊必等兩邊既等則餘一角亦等第二十七題兩直線有他直線交加其上若内相對兩角等即兩直線必平行解曰甲乙丙丁兩直線加他直線戊巳交于庚于辛而甲庚辛與丁辛庚兩角等題言甲乙丙丁兩線必平行論曰如云不然則甲乙丙丁兩直線必至相遇于壬而庚辛壬成三角形則甲庚辛外角宜大于相對之庚辛壬内角矣本篇十六乃先設相等乎若設乙庚辛角與丙辛庚角等亦依此論若言甲乙丙丁兩直線相遇于癸亦依此論第二十八題二支兩直線有他直線交加其上若外角與同方相對之内角等或同方兩内角與兩直角等即兩直線必平行先解曰甲乙丙丁兩直線加他直線戊巳交于庚于辛其戊庚甲外角與同方相對之庚辛丙内角等題言甲乙丙丁兩線必平行論曰乙庚辛角與相對之内角丙辛庚等本篇廿七戊庚甲與乙庚辛兩交角亦等本篇十五即兩直線必平行後解曰甲庚辛丙辛庚兩内角與兩直角等題言甲乙丙丁兩線必平行論曰甲庚辛丙辛庚兩角與兩直角等而甲庚戊甲庚辛兩角亦與兩直角等本篇十三試減同用之甲庚辛即所存甲庚戊與丙辛庚等矣既外角與同方相對之内角等即甲乙丙丁必平行本題第二十九題三支兩平行線有他直線交加其上則内相對兩角必等外角與同方相對之内角亦等同方兩内角亦與兩直角等先解曰此反前二題故同前圖有甲乙丙丁二平行線加他直線戊巳交于庚于辛題言甲庚辛與丁辛庚内相對兩角必等論曰如云不然而甲庚辛大于丁辛庚則丁辛庚加辛庚乙宜小于辛庚甲加辛庚乙矣公論四夫辛庚甲辛庚乙元與兩直角等本篇十三據如彼論則丁辛庚辛庚乙兩角小于兩直角而甲乙丙丁兩直線向乙丁行必相遇也公論十一可謂平行線乎次解曰戊庚甲外角與同方相對之庚辛丙内角等論曰乙庚辛與相對之丙辛庚兩内角等本題則乙庚辛交角相等之戊庚甲本篇十五與丙辛庚必等公論一後解曰甲庚辛丙辛庚兩内角與兩直角等論曰戊庚甲與庚辛丙兩角既等本題而每加一甲庚辛角則庚辛丙甲庚辛兩角與甲庚辛戊庚甲兩角必等公論二夫甲庚辛戊庚甲本與兩直角等本篇十三則甲庚辛丙辛庚兩内角亦與兩直角等第三十題兩直線與他直線平行則元兩線亦平行解曰此題所指線在同面者不同面線後别有論如甲乙丙丁兩直線各與他線戊巳平行題言甲乙與丙丁亦平行論曰試作庚辛直線交加于三直線甲乙于壬戊巳于子丙丁于癸其甲乙與戊巳既平行即甲壬子與相對之巳子壬兩内角等本篇廿九丙丁與戊巳既平行即丁癸子内角與巳子壬外角亦等本篇廿九丁癸子與甲壬子亦為相對之内角亦等公論一而甲乙丙丁為平行線本篇廿七第三十一題一㸃上求作直線與所設直線平行法曰甲㸃上求作直線與乙丙平行先從甲㸃向乙丙線任指一處作直線為甲丁即乙丙線上成甲丁乙角次于甲㸃上作一角與甲丁乙等本篇廿三為戊甲丁從戊甲線引之至巳即巳戊與乙丙平行論曰戊已乙丙兩線有甲丁線聯之其所作戊甲丁與甲丁乙相對之兩内角等即平行線本篇廿七増増題法曰甲與乙兩直線形甲大于乙以乙減甲求較幾何先任作丁丙巳戊平行方形與甲等次于丙丁線上依丁角作丁丙辛庚平行方形與乙等本題即得辛庚戊巳為相減之較矣何者丁丙巳戊之大于丁丙辛庚較餘一辛庚戊巳也則甲大于乙亦辛庚戊巳也
