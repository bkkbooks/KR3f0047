  - {type: variant, offset: 6101, length: 0, content: '', WYG: 試于甲戊線内任取一㸃為庚自庚至丁作直線其甲丁庚角形之丁甲庚丁庚甲兩角小于兩直角一卷十七而丁甲庚為直角即丁庚甲小于直角對大角之丁庚線大于對小角之丁甲線矣一卷十九則庚㸃在圜之外也凡戊甲以内作㸃皆依此論故戊甲線全在圜外増次解曰從甲作甲辛線在戊甲之下題言甲辛必割圜為分}
  - {type: page-break, offset: 6101, content: '', id: KR3f0047_WYG_003-26a, image: WYG0798/WYG0798-0630c.png}
