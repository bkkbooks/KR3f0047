  - {type: variant, offset: 2540, length: 0, content: '', WYG: 以數明之設十數兩平分之各五又任分之為七為三分内數二其七之羃四十九及三之羃九倍大于五之羃二十五及二之羃四第十題一直線兩平分之又任引増一線共為一全線其全線上及引増線上兩直角方形并倍大于平分半線上及分餘半線偕引増線上兩直角方形并解曰甲乙直線平分于丙又任引増為乙丁題言甲丁線上及乙丁線上兩直角方形并倍大于甲丙線上及丙丁線上兩直角方形并論曰試于丙上作丙戊垂線與甲丙等自戊至甲至乙各作腰線次從丁作己丁垂線引長之又從戊乙引長之遇于庚次作戊己線與丙丁平行末作甲庚線依前題論推顯甲戊乙為直角丙戊乙為半直角即相對之戊庚己亦半直角一卷廿九又己為直角一卷卅四即己戊庚亦半直角一卷卅二而己戊己庚兩腰必等一卷六依顯乙丁丁庚兩腰亦等夫甲戊上直角方形等于甲丙丙戊上兩直角方形并一卷四七必倍大于甲丙上直角方形而戊庚上直角方形等于戊己己庚上兩直角方形并一卷四七必倍大于對戊己邊之丙丁上直角方形一卷卅四則甲戊戊庚上兩直角方形并倍大于甲丙丙丁上兩直角方形并也又甲庚上直角方形等于甲戊戊庚上兩直角方形并亦等于甲丁丁庚上兩直角方形并則甲丁丁庚上兩直角方形并亦倍大于甲丙丙丁上兩直角方形并也而甲丁乙丁上兩直角方形并倍大于甲丙丙丁上兩直角方形并矣丁庚與乙丁等故}
