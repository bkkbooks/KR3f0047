  - {type: line-break, offset: 6109, content: '', id: KR3f0047_WYG_003-bkklb488}
  - {type: variant, offset: 6109, length: 0, content: '', WYG: 戊甲乙切邊角為小率壬庚辛直線鋭角為大率今别作甲丙甲丁等圜俱切戊己線于甲其切邊角愈増愈大如前論别以庚癸庚子線作角分壬庚辛角于庚愈分愈小然直線角恒大切邊角恒小乃至終古不得相比又増題舊有一説以一小率加一大率之上或以一大率加一小率之上不相離逐線漸移之必至一相等之處又一説有率大于此率者有率小于此率者則必有率等于此率者昔人以為皆公論也若用以律本題即不可得故今斥不為公論解曰甲乙丙圜其徑甲丙令甲丙之甲界定在于甲而引丙線逐線漸移之向已其所經丁戊己及中間逐線所經無數然依本題論則甲丙所經凡割圜時皆為鋭角即小于半圜分角纔離鋭角便為直角即大于半圜分角是所經無數線終無有相等線可見前一舊説未為公論又直線鋭角皆小于半圜分角直角與鈍角皆大于半圜分角是有大者有小者終無等者可見後一舊説未為公論也}
