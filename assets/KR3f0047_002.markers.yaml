  - {type: variant, offset: 2538, length: 0, content: '', WYG: 以數明之設十數任分之為六為四如前圖十六互乘之實四為二百四十及四之羃十六共二百五十六與十六之羃等如後圖十四互乘之實四為一百六十及六之羃三十六共一百九十六與十四之羃等第九題一直線兩平分之又任兩分之任分線上兩直角方形并倍大于平分半線上及分内線上兩直角方形并解曰甲乙線平分于丙又任分于丁題言甲丁丁乙上兩直角方形并倍大于平分半線甲丙上分内線丙丁上兩直角方形并論曰試于丙上作丙戊垂線與甲丙等次作甲戊戊乙兩腰次從丁作丁己垂線遇戊乙于己從己作己庚線與甲乙平行遇戊丙于庚末作甲己線其甲丙戊角形之甲丙丙戊兩腰等即丙戊甲丙甲戊兩角亦等一卷五而甲丙戊為直角即餘兩角皆半直角一卷卅二之系依顯丙戊乙亦半直角又戊庚己角形之戊庚己角為戊丙乙之外角即亦直角一卷廿九而庚戊己半直角即庚己戊亦半直角一卷卅二之系又庚戊己庚己戊兩角等即庚戊庚己兩腰亦等一卷六依顯丁乙己角形之丁乙丁己兩腰亦等夫甲丙戊角形之丙為直角即甲戊線上直角方形與甲丙丙戊線上兩直角方形并等一卷四七而甲丙丙戊上兩直角方形自相等即甲戊上直角方形倍大于甲丙上直角方形矣又戊庚己角形之庚為直角即戊己線上直角方形與庚戊庚己線上兩直角方形并等一卷四七而庚戊庚己上兩直角方形自相等即戊己上直角方形倍大于等庚己之丙丁上直角方形矣庚己丙丁為丙己直角形之對邊故見一卷卅四則是甲戊戊己上兩直角方形并倍大于甲丙丙丁上兩直角方形并也又甲己上直角方形既等于甲戊戊己上兩直角方形并又等于甲丁丁己上兩直角方形并一篇四七則甲丁丁己上兩直角方形并亦倍大于甲丙丙丁上兩直角方形并矣而丁己與丁乙等則甲丁丁乙上兩直角方形并豈不倍大于甲丙丙丁上兩直角方形并也}
