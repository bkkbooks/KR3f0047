body:
  text: 幾何原本天文算法類二算書之屬提要臣等謹案幾何原本六卷西洋歐几里得撰利瑪竇譯而徐光啓所筆受也歐几里得未詳何時人其原書十三卷五百餘題利瑪竇之師丁氏為之集解又續補二卷於後共為十五卷今止六卷者徐光啓自謂譯受是書此其最要者也其書每卷有界説有公論有設題界説者先取所用名目解説之公論者舉其不可疑之理設題則據所欲言之理次第設之先其易者次其難者由淺而深由簡而繁推之至於無以復加而後已又每題有法有解有論有系法言題用解述題意論則發明其所以然之理系則又有旁通者焉卷一論三角形卷二論線卷三論圓卷四論圓内外形卷五卷六俱論比例其餘三角方圓邊線面積體積比例變化相生之義無不曲折盡顯纎㣲畢露光啓序稱其窮方圓平直之情盡規矩準繩之用非虚語也且此為歐邏巴算學専書前作後述不絶於世至歐几里得而為是書盖亦集諸家之成故自始至終毫無疵纇加以光啓反覆推闡其文句尤為明顯以是弁冕西術不為過矣乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀幾何原本序唐虞之世自羲和治厯暨司空后稷工虞典樂五官者非度數不為功周官六藝數與㞐一焉而五藝者不以度數從事亦不得工也襄曠之於音般墨之於械豈有他謬巧哉精于用法爾已故嘗謂三代而上為此業者盛有元元本本師𫝊曹習之學而畢喪於祖龍之𦦨漢以來多任意揣摩如盲人射的虚發無效或依儗形似如持螢燭象得首失尾至於今而此道盡廢有不得不廢者矣幾何原本者度數之宗所以窮方圓平直之情盡規矩準繩之用也利先生從少年時論道之暇留意藝學且此業在波中所謂師𫝊曹習者其師丁氏又絶代名家也以故極精其說而與不佞游久講談餘晷時時及之因請其象數諸書更以華文獨謂此書未譯則他書俱不可得論遂共翻其要約六卷既平業而復之由顯入微從疑得信蓋不用為用衆用所基真可謂萬象之形囿百家之學海雖實未竟然以當他書既可得而論矣私心自謂不意古學廢絶二千年後頓獲補綴唐虞三代之闕典遺義其裨益當世定復不小因偕二三同志刻而傳之先生曰是書也以當百家之用度幾有羲和般墨其人乎猶其小者有大用于此將以習人之靈才令細而確也余以為小用大用實在其人如鄧林伐材棟梁榱桷恣所取之耳顧惟先生之學略有三種大者修身事天小者格物窮理物理之一端别為象數一一皆精實典要洞無可疑其分解擘析亦能使人無疑而余乃亟傳其小者趨欲先其易信使人繹其文想見其意理而知先生之學可信不疑大㮣如是則是書之為用更大矣他所說幾何諸家藉此為用略具其自敘中不備論吳淞徐光啟書
